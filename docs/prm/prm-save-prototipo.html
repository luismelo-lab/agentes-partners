<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRM Save · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* PRM Save · protótipo navegável · Design System Save v0.5 (valores de marca.json).
   Parceiro: modo claro. Save (gestão do canal): modo escuro de painel. O botão de tema alterna. */
:root {
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --fundo:#F6F7F9; --fundo-2:#F1F2F5; --cartao:#FFFFFF; --borda:#E6E8EC; --borda-2:#DEE0E5; --borda-3:#C9CCD3;
  --texto:#0F1115; --texto-2:#4A4F58; --texto-3:#838892;
  --ouro:#F3CD60; --ouro-texto:#B58A1F; --ouro-suave:#FBF1D7; --sobre-ouro:#0F1115;
  --sucesso:#1E8E3E; --alerta:#B5790F; --erro:#C5221F; --info:#1A56DB;
  --sombra:0 1px 2px rgba(15,17,21,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fundo:#000000; --fundo-2:#111111; --cartao:#171717; --borda:#2A2A2A; --borda-2:#2A2A2A; --borda-3:#3A3A3A;
  --texto:#F5F5F5; --texto-2:#A1A1A1; --texto-3:#8A8A8A;
  --ouro:#F3CD60; --ouro-texto:#F3CD60; --ouro-suave:rgba(243,205,96,.12); --sobre-ouro:#000000;
  --sucesso:#44C653; --alerta:#E8B34A; --erro:#D64545; --info:#6E92E8; --sombra:none; color-scheme:dark } }
:root[data-theme="dark"] {
  --fundo:#000000; --fundo-2:#111111; --cartao:#171717; --borda:#2A2A2A; --borda-2:#2A2A2A; --borda-3:#3A3A3A;
  --texto:#F5F5F5; --texto-2:#A1A1A1; --texto-3:#8A8A8A;
  --ouro:#F3CD60; --ouro-texto:#F3CD60; --ouro-suave:rgba(243,205,96,.12); --sobre-ouro:#000000;
  --sucesso:#44C653; --alerta:#E8B34A; --erro:#D64545; --info:#6E92E8; --sombra:none; color-scheme:dark }
.marca img.logo-escuro{display:none}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .marca img.logo-escuro{display:block} :root:not([data-theme="light"]) .marca img.logo-claro{display:none} }
:root[data-theme="dark"] .marca img.logo-escuro{display:block} :root[data-theme="dark"] .marca img.logo-claro{display:none}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rot{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ouro-texto)}
.apoio{color:var(--texto-2);font-size:14px}
.fraco{color:var(--texto-3);font-size:13px}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo */
.topo{position:sticky;top:0;z-index:30;background:var(--cartao);border-bottom:1px solid var(--borda)}
.faixa-ouro{height:3px;background:var(--ouro)}
.topo-in{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 24px}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca img{height:22px;width:auto}
.marca .sep{width:1px;height:20px;background:var(--borda-3)}
.marca b{font-weight:600;font-size:15px;white-space:nowrap}
.selo-prev{font:500 11px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--ouro-suave);color:var(--ouro-texto);white-space:nowrap}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--borda-2);border-radius:12px;background:var(--fundo-2)}
.seg button{border:0;border-radius:8px;background:transparent;color:var(--texto-2);min-height:36px;padding:0 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ouro);color:var(--sobre-ouro);font-weight:600}
.icbtn{width:44px;height:44px;border:1px solid var(--borda-2);border-radius:12px;background:var(--cartao);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--texto-2)}
.icbtn svg{width:18px;height:18px}

/* estrutura */
.casca{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 72px)}
nav.menu{border-right:1px solid var(--borda);padding:20px 12px;display:flex;flex-direction:column;gap:2px;background:var(--fundo)}
nav.menu .rot{padding:0 12px 10px;color:var(--texto-3)}
nav.menu button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--texto-2);text-align:left;cursor:pointer;font-size:14.5px}
nav.menu button:hover{background:var(--fundo-2);color:var(--texto)}
nav.menu button[aria-current="page"]{background:var(--cartao);color:var(--texto);font-weight:600;box-shadow:inset 3px 0 0 var(--ouro);border:1px solid var(--borda)}
.cont{font:600 11px/18px var(--mono);min-width:22px;padding:0 6px;border-radius:999px;background:var(--ouro);color:var(--sobre-ouro);text-align:center}
.quem{margin-top:auto;padding:12px;border:1px solid var(--borda);border-radius:12px;background:var(--cartao);font-size:13px}
.quem b{display:block;font-weight:600}
main{padding:28px 32px 64px;min-width:0;max-width:1180px;width:100%}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:24px}
.cab h1{font-size:28px;margin-top:6px}
.cab p{margin-top:6px;color:var(--texto-2);max-width:70ch}

/* componentes */
.grade{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:20px;box-shadow:var(--sombra);min-width:0}
.cartao h2{font-size:17px;margin-bottom:12px}
.cartao h3{font-size:15px}
.kpi .v{font:500 28px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .d{font-size:13px;color:var(--texto-2);margin-top:4px}
.lista{display:grid;gap:0}
.item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:14px 0;border-top:1px solid var(--borda)}
.item:first-child{border-top:0;padding-top:4px}
.item .t{font-weight:500}
.item .s{font-size:13px;color:var(--texto-2)}
.item>div{min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1.7 var(--mono);padding:1px 8px;border-radius:6px;border:1px solid var(--borda-3);color:var(--texto-2);white-space:nowrap;background:transparent}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--texto-3);flex:none}
.chip.ok::before{background:var(--sucesso)} .chip.at::before{background:var(--alerta)} .chip.er::before{background:var(--erro)}
.chip.ouro{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro);font-weight:600} .chip.ouro::before{background:var(--sobre-ouro)}
.chip.neutro::before{background:transparent;border:1.5px solid var(--texto-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--ouro);background:var(--ouro);color:var(--sobre-ouro);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.sec{background:transparent;border-color:var(--borda-3);color:var(--texto);font-weight:500}
.btn.peq{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:500;font-size:14px}
label small{font-weight:400;color:var(--texto-3)}
input,select,textarea{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid var(--borda-3);border-radius:8px;background:var(--cartao);color:var(--texto);font-size:15px}
textarea{min-height:96px;resize:vertical}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.dica{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--texto-2)}
.dica button{border:1px dashed var(--borda-3);background:transparent;border-radius:6px;padding:4px 8px;font:500 12px var(--mono);cursor:pointer;color:var(--texto-2);min-height:32px}
.resultado{border-radius:12px;padding:16px 18px;border:1px solid var(--borda-3);background:var(--fundo-2)}
.resultado.livre{border-color:var(--sucesso)}
.resultado.meu{border-color:var(--info)}
.resultado.analise{border-color:var(--ouro);background:var(--ouro-suave)}
.resultado h3{font-size:15px;margin-bottom:4px}
.nota{border:1px dashed var(--borda-3);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--texto-2)}
.nota b{color:var(--texto)}
.aviso{border:1px solid var(--ouro);background:var(--ouro-suave);border-radius:10px;padding:12px 14px;font-size:13.5px}
.barra{height:10px;border-radius:999px;background:var(--fundo-2);border:1px solid var(--borda);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ouro);border-radius:999px}
.passos{display:flex;flex-wrap:wrap;gap:8px}
.passo{flex:1 1 120px;border:1px solid var(--borda);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--fundo-2);min-width:0}
.passo b{display:block;font-size:13.5px}
.passo.feito{background:var(--cartao);border-color:var(--sucesso)}
.passo.atual{border-color:var(--ouro);background:var(--ouro-suave)}
.linha-tempo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.lt{border-top:3px solid var(--borda-3);padding-top:6px;font-size:12px;color:var(--texto-3);min-width:0}
.lt b{display:block;color:var(--texto-2);font-weight:500;font-size:12.5px}
.lt.feito{border-color:var(--sucesso)} .lt.feito b{color:var(--texto)}
.lt.atual{border-color:var(--ouro)} .lt.atual b{color:var(--texto);font-weight:600}
.tabela{overflow-x:auto;border:1px solid var(--borda);border-radius:12px;background:var(--cartao)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2);padding:12px;border-bottom:1px solid var(--borda-3);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--borda);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.desc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0 0;font-size:13.5px}
.desc dt{color:var(--texto-2)} .desc dd{margin:0;text-align:right;font-family:var(--mono)}
.selo-nivel{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--texto);color:var(--fundo)}
.selo-nivel .m{width:30px;height:30px;border-radius:50%;background:var(--ouro);color:#0F1115;display:flex;align-items:center;justify-content:center;font:700 13px var(--mono)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:12px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);z-index:50;box-shadow:0 4px 12px rgba(15,17,21,.2)}
.rodape{margin-top:40px;font-size:12.5px;color:var(--texto-3);border-top:1px solid var(--borda);padding-top:16px}
details summary{cursor:pointer;font-weight:500;min-height:32px;display:flex;align-items:center}

@media (max-width: 900px){
  .casca{grid-template-columns:1fr}
  nav.menu{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--borda);padding:8px 16px;gap:6px;position:sticky;top:0;z-index:20}
  nav.menu .rot,.quem{display:none}
  nav.menu button{width:auto;flex:none;white-space:nowrap}
  nav.menu button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--ouro)}
  main{padding:20px 16px 48px}
  .topo-in{padding:10px 16px}
  .cab h1{font-size:23px}
}
@media (max-width: 520px){
  .marca .sep,.marca b{display:none}
  .topo-dir{margin-left:0;width:100%;flex-wrap:nowrap}
  .seg{flex:1;min-width:0} .seg button{flex:1;padding:4px 8px;font-size:12.5px;white-space:normal;line-height:1.2}
  .linha-tempo{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:24px}
  .cartao{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

TELAS.biblioteca = () => cab("Biblioteca", "Kits por tese e por produto", "Cada kit traz: o que é, para quem serve, perguntas de qualificação, o que não dizer e a peça com a relação de parceiro identificada. Todo material passa pela revisão de promessas da Save.") +
  `<div class="grade g3">${CATALOGO.map(c => `<article class="cartao"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="rot" style="color:var(--texto-2)">${c.t}</span>${c.e === "pronto" ? `<span class="chip ok">Pronto</span>` : `<span class="chip at">Em descoberta</span>`}</div>
    <h3 style="margin-top:8px">${c.n}</h3>
    ${c.e === "pronto" ? `<p class="apoio" style="margin-top:8px">Kit de venda, perguntas de qualificação e o que não dizer ao cliente.</p><div class="acoes" style="margin-top:12px"><button class="btn peq sec" data-acao="baixar" data-v="${esc(c.n)}">Abrir kit</button></div>` :
    `<p class="apoio" style="margin-top:8px">Produto em validação. Sem material, condição ou simulação por enquanto. Se o cliente perguntar, registre o interesse em Demandas.</p><div class="acoes" style="margin-top:12px"><button class="btn peq sec" data-acao="ir" data-v="demandas">Registrar interesse</button></div>`}</article>`).join("")}</div>
  <section class="cartao" style="margin-top:16px"><h2>Academia</h2><div class="passos"><div class="passo feito"><b>N1 · Fundamentos</b>Concluída</div><div class="passo atual"><b>N2 · Teses e qualificação</b>Em curso</div><div class="passo"><b>Gestão de Passivo</b>Porta para o produto</div></div><p class="fraco" style="margin-top:10px">Certificação serve de porta para produto complexo, não de degrau de nível.</p></section>`;

/* ---------- telas da Save ---------- */
TELAS.canal = () => {
  const kpis = [["Masters ativos em 90 dias", "9 de 9", "todos com negócio no período"], ["Consultores dormentes", "12 de 25", "sem indicação em 90 dias"], ["Concentração top 5", "88%", "do fechado em 12 meses"], ["Registros a vencer", "6", "em até 15 dias"], ["Conflitos abertos", "4", "1 de severidade alta"], ["Demandas fora do SLA", String(S.sla.filter(d => d.estado === "Fora do SLA").length), "de " + S.sla.length + " abertas"], ["Adoção do portal", "2 de 9", "Masters no piloto"], ["Extratos a liberar", String(S.lotes.filter(l => !l.liberado).length), "lotes de outubro"]];
  return cab("Visão do canal", "Saúde, dormentes, concentração e conflitos", "Só a Save vê esta tela. Saúde de 0 a 100 com ritmo de entrada, conversão, ritmo de valor e qualidade do dado.") +
  `<div class="grade g4" style="margin-bottom:16px">${kpis.map(k => `<div class="cartao kpi"><span class="rot">${k[0]}</span><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join("")}</div>
  <div class="tabela"><table><caption class="so-leitor">Saúde por Master</caption><thead><tr><th>Master</th><th class="num">Saúde</th><th>Leitura</th><th class="num">Consultores dormentes</th><th class="num">Registros a vencer</th><th class="num">Conflitos</th><th>Ação sugerida</th></tr></thead><tbody>
  ${S.masters.map(m => `<tr><td><b>Master ${m[0]}</b></td><td class="num mono">${m[1] == null ? "base pequena" : m[1] + (m[1] >= 75 ? " · bom" : m[1] >= 50 ? " · atenção" : " · risco")}</td><td>${m[2]}</td><td class="num mono">${m[3]}</td><td class="num mono">${m[4]}</td><td class="num mono">${m[5]}</td><td>${m[1] != null && m[1] < 50 ? "Plano de reativação com Partner Success" : m[3] >= 4 ? "Reativar consultores" : m[5] ? "Levar conflito à decisão" : "Manter plano de conta"}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="grade g2" style="margin-top:16px">
    <section class="cartao"><h2>Concentração do fechado em 12 meses</h2>${[["Master A", 34], ["Master B", 22], ["Master C", 14], ["Master D", 10], ["Master E", 8], ["Demais", 12]].map(c => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${c[0]}</span><span class="mono">${c[1]}%</span></div><div class="barra" aria-hidden="true"><i style="width:${c[1]}%"></i></div></div>`).join("")}</section>
    <section class="cartao"><h2>Conflitos abertos</h2><div class="lista">
      <div class="item"><div><span class="t">Raiz 22.•••.•22 · Master B × Master F</span><div class="s">1º registro do Master B em 02/09; novo pedido do Master F em 24/10.</div></div><span class="chip er">Alta · com o Luis</span></div>
      <div class="item"><div><span class="t">Raiz 46.•••.•46 · Master C × Indicador 02</span><div class="s">Indicador sem registro; Master com card de 2025.</div></div><span class="chip at">Média</span></div>
      <div class="item"><div><span class="t">Raiz 47.•••.•47 · Master G × BDR</span><div class="s">Lead da BDR reservado ao Master G em 12/10 (reserva de 45 dias).</div></div><span class="chip">Baixa</span></div>
    </div><p class="fraco" style="margin-top:10px">O sistema mostra os fatos e a regra; quem decide o conflito é o Luis.</p></section>
  </div>`;
};

TELAS.fila = () => cab("Fila de registros", "Aprovar, recusar ou enviar a conflito", "Ordem de chegada pelo carimbo de hora. A Save vê o motivo real da checagem; o parceiro vê só a mensagem neutra.") +
  `<div class="grade">${S.fila.map(f => `<article class="cartao"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3>${esc(f.empresa)} <span class="fraco mono">${esc(f.id)}</span></h3>${f.estado === "Novo" ? `<span class="chip ouro">Novo</span>` : f.estado === "Aprovado" ? `<span class="chip ok">Aprovado</span>` : f.estado === "Recusado" ? `<span class="chip neutro">Recusado</span>` : `<span class="chip er">${esc(f.estado)}</span>`}</div>
    <p class="fraco mono" style="margin-top:4px">${mascara(f.raiz)} · ${esc(f.parceiro)} · ${esc(f.quando)}</p>
    <p style="margin-top:10px;font-size:14px"><span class="chip ${f.checagem === "Livre" ? "ok" : f.checagem === "Outro canal" ? "er" : "at"}">Checagem: ${esc(f.checagem)}</span> <span class="apoio">${esc(f.detalhe)}</span></p>
    ${f.estado === "Novo" ? `<div class="acoes" style="margin-top:12px"><button class="btn peq" data-acao="fila-aprovar" data-v="${f.id}" ${f.checagem !== "Livre" ? "disabled title=\"Raiz com negócio ou registro: recusar ou enviar a conflito\"" : ""}>Aprovar (${VALIDADE_MASTER} dias)</button><button class="btn peq sec" data-acao="fila-recusar" data-v="${f.id}">Recusar com mensagem neutra</button><button class="btn peq sec" data-acao="fila-conflito" data-v="${f.id}">Enviar a conflito (Luis)</button></div>` : ""}</article>`).join("")}</div>
  <p class="fraco" style="margin-top:12px">Ao aprovar, a Central Masters cria o card no HubSpot pelo fluxo atual; o PRM não escreve no CRM.</p>`;

const ITENS_LOTE = [["termo", "Termo vigente"], ["cnpj", "CNPJ do parceiro ativo"], ["nf", "NF recebida"], ["ret", "Retenções calculadas"], ["bloq", "Sem linha bloqueada"], ["conf", "Conflito resolvido"]];
TELAS.extratos = () => cab("Extratos a liberar", "Lotes de outubro por parceiro", "Libera só o que foi recebido e conferido. Linha atípica fica em conferência contratual, sem valor nem data para o parceiro.") +
  `<div class="grade g2">${S.lotes.map((l, i) => { const ok = Object.values(l.ok).every(Boolean); return `<article class="cartao"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3>${l.master}</h3>${l.liberado ? `<span class="chip ok">Liberado</span>` : ok ? `<span class="chip ouro">Pronto para liberar</span>` : `<span class="chip at">Pendente</span>`}</div>
    <p class="fraco" style="margin-top:4px">${l.linhas} linha(s) · base recebida <span class="mono">${brl(l.base)}</span></p>
    <ul style="list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;font-size:13.5px">${ITENS_LOTE.map(([k, n]) => `<li style="display:flex;justify-content:space-between;gap:8px"><span>${n}</span><span class="chip ${l.ok[k] ? "ok" : "er"}">${l.ok[k] ? "OK" : "Pendente"}</span></li>`).join("")}</ul>
    ${l.nota ? `<p class="apoio" style="margin-top:10px">${l.nota}</p>` : ""}
    <div class="acoes" style="margin-top:12px">${l.liberado ? "" : `<button class="btn peq" data-acao="liberar" data-v="${i}" ${ok ? "" : "disabled"}>Liberar lote</button>`}${!l.ok.nf ? `<button class="btn peq sec" data-acao="nf-lote" data-v="${i}">Marcar NF recebida</button>` : ""}</div></article>`; }).join("")}</div>
  <p class="fraco" style="margin-top:12px">Conferência e pagamento são do Financeiro; o percentual de cada parceiro vem do termo, não do card.</p>`;

TELAS.sla = () => cab("Demandas por SLA", "Fila única de pedidos dos parceiros", "Portal e WhatsApp caem na mesma fila. O histórico sugere a resposta; a Central Masters aprova antes de sair. Chamado só quando a área precisa entrar.") +
  `<div class="tabela"><table><caption class="so-leitor">Demandas por SLA</caption><thead><tr><th>Pedido</th><th>Parceiro</th><th>Tipo</th><th class="num">Aberta há</th><th>SLA</th><th>Caminho</th><th>Ação</th></tr></thead><tbody>
  ${S.sla.map(d => { const fora = d.aberta > d.sla && d.estado !== "Enviada"; return `<tr><td><b class="mono">${d.id}</b><div class="apoio">${esc(d.texto)}</div></td><td>${esc(d.parceiro)}</td><td>${esc(d.tipo)}</td><td class="num mono">${d.aberta} h</td><td><span class="chip ${d.estado === "Enviada" ? "ok" : fora ? "er" : "at"}">${d.estado === "Enviada" ? "Atendida" : fora ? "Fora · " + d.sla + " h" : "No prazo · " + d.sla + " h"}</span></td><td>${d.via === "historico" ? "Resposta do histórico" : "Chamado · " + esc(d.area)}</td><td>${d.estado === "Enviada" ? `<span class="chip ok">Enviada</span>` : d.via === "historico" ? `<button class="btn peq" data-acao="sla-ok" data-v="${d.id}">Aprovar e enviar</button>` : `<button class="btn peq sec" data-acao="sla-glpi" data-v="${d.id}">${d.glpi ? "Rascunho no GLPI criado" : "Aprovar e abrir chamado"}</button>`}</td></tr>`; }).join("")}
  </tbody></table></div>
  <p class="fraco" style="margin-top:12px">GLPI só em rascunho até a liberação. Nenhuma resposta automática com valor, prazo, tese ou cobrança.</p>`;

/* ---------- ações ---------- */
function tema(t) { document.documentElement.setAttribute("data-theme", t); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-acao]"); if (!b || b.disabled) return;
  const v = b.dataset.v;
  switch (b.dataset.acao) {
    case "ir": S.tela = v; if (v !== "registrar") S.ultimaChecagem = null; render(true); window.scrollTo(0, 0); break;
    case "perfil": S.perfil = v; S.tela = v === "parceiro" ? "inicio" : "canal"; if (!S.temaManual) tema(v === "parceiro" ? "light" : "dark"); render(true); break;
    case "tema": S.temaManual = true; tema(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); break;
    case "exemplo": { const f = document.getElementById("form-registro"); f.cnpj.value = v; f.empresa.value = f.empresa.value || "Empresa 16"; f.cnpj.focus(); break; }
    case "prorrogar": { const r = S.registros.find(x => x.id === v); r.prorrog = true; aviso("Pedido de prorrogação enviado à Área Partners."); render(); break; }
    case "perguntar": S.tela = "demandas"; render(true); document.querySelector('#form-demanda [name="negocio"]').value = v; document.querySelector('#form-demanda [name="texto"]').focus(); break;
    case "nf": { const x = S.extrato.find(y => y.id === v); x.nf = "NF 1.231 (enviada hoje)"; aviso("NF anexada. A Área Partners confere e segue o calendário do programa."); render(); break; }
    case "contestar": { const x = S.extrato.find(y => y.id === v); x.cont = data(HOJE); aviso("Contestação aberta. A resposta aparece nesta linha."); render(); break; }
    case "baixar": aviso("Protótipo: o arquivo do kit não está incluído."); break;
    case "fila-aprovar": case "fila-recusar": case "fila-conflito": {
      const f = S.fila.find(x => x.id === v);
      f.estado = b.dataset.acao === "fila-aprovar" ? "Aprovado" : b.dataset.acao === "fila-recusar" ? "Recusado" : "Com o Luis (conflito)";
      const r = S.registros.find(x => x.id === v);
      if (r) {
        if (f.estado === "Aprovado") { r.estado = "Aprovado"; r.valido = soma(HOJE, VALIDADE_MASTER); }
        else if (f.estado === "Recusado") r.estado = "Não aprovado";
        else r.estado = "Em análise pela Área Partners";
      }
      aviso(f.estado === "Aprovado" ? "Registro aprovado. Validade contada a partir de hoje." : f.estado === "Recusado" ? "Registro recusado. O parceiro vê a mensagem neutra." : "Enviado à decisão do Luis com os fatos da raiz.");
      render(); break;
    }
    case "liberar": S.lotes[+v].liberado = true; aviso(`Lote do ${S.lotes[+v].master} liberado ao Financeiro.`); render(); break;
    case "nf-lote": S.lotes[+v].ok.nf = true; render(); break;
    case "sla-ok": { const d = S.sla.find(x => x.id === v); d.estado = "Enviada"; aviso("Resposta aprovada e enviada ao parceiro."); render(); break; }
    case "sla-glpi": { const d = S.sla.find(x => x.id === v); d.glpi = true; aviso(`Rascunho do chamado criado para ${d.area}. O GLPI segue só em rascunho.`); render(); break; }
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "form-registro") {
    const cnpj = f.cnpj.value.replace(/[^0-9A-Za-z]/g, "").toUpperCase();
    const erro = document.getElementById("erro-registro");
    if (cnpj.length !== 14) { erro.textContent = "Informe o CNPJ completo (14 caracteres)."; f.cnpj.focus(); return; }
    if (!f.empresa.value.trim()) { erro.textContent = "Informe o nome da empresa."; f.empresa.focus(); return; }
    const raiz = raizDe(cnpj), empresa = f.empresa.value.trim().slice(0, 60);
    const meu = S.registros.find(r => r.raiz === raiz);
    const quando = data(HOJE) + " · " + new Date().toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
    if (meu) { S.ultimaChecagem = {tipo: "meu", reg: meu}; render(); return; }
    const id = "R-0" + (++S.seq);
    const outros = new Set(S.fila.filter(x => x.origem === "fila").map(x => x.raiz));
    const analise = outros.has(raiz) || /^(\d)\1{7}$/.test(raiz);
    S.registros.unshift({id, empresa, raiz, criado: new Date(HOJE), estado: analise ? "Em análise pela Área Partners" : "Recebido · em análise", valido: null, prorrog: false});
    S.fila.unshift({id, parceiro: "Master A (Consultor 01)", empresa, raiz, quando,
      checagem: analise ? (raiz === "33333333" ? "Negócio ativo" : "Outro canal") : "Livre",
      detalhe: analise ? (raiz === "33333333" ? "Ganho na mesma raiz. O parceiro recebeu a mensagem neutra." : "Mesma raiz com registro de outro parceiro. Sugestão: enviar a conflito.") : "Nenhum negócio nem registro na raiz.",
      estado: "Novo", origem: "portal"});
    S.ultimaChecagem = {tipo: analise ? "analise" : "livre", id, empresa, quando};
    render();
  }
  if (f.id === "form-demanda") {
    const tipo = f.tipo.value, negocio = f.negocio.value, texto = f.texto.value.trim().slice(0, 500);
    if (!texto) { f.texto.focus(); return; }
    const area = AREA_TIPO[tipo];
    const id = "D-2026-0" + (++S.seqD);
    const quando = "26/10 · " + new Date().toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
    const hist = !area && negocio !== "Nenhum";
    S.demandas.unshift({id, tipo, negocio, texto, via: hist ? "historico" : "chamado", area: area || "Central Masters", aberta: quando, estado: hist ? "Respondida" : "Com a área",
      resposta: hist ? RESP_HIST[tipo](negocio) + " (resposta do histórico, conferida pela Central Masters)" : `A Central Masters abriu o pedido para ${area || "a Central Masters"}. O retorno aparece aqui.`});
    S.sla.unshift({id, parceiro: "Master A", tipo, texto, aberta: 0, sla: hist ? 8 : 24, via: hist ? "historico" : "chamado", area: area || "Central Masters", estado: hist ? "Enviada" : "Com a área"});
    aviso(hist ? "Respondido pelo histórico." : "Chamado aberto na área.");
    render();
  }
});

render();
</script>
</body>
</html>
