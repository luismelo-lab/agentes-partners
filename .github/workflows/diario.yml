name: Dados do dia (HubSpot, Dados & BI, SharePoint)
# Horários em UTC (Brasília = UTC-3). Desligado até AGENTES_NUVEM=ligado (ver docs/NUVEM.md).
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
env:
  TZ: America/Sao_Paulo
  AGENTES_EMAIL: graph
  AGENTES_ARQUIVOS: sharepoint
  OD_RAIZ: /tmp/area-partners
  HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
  GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
  GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
  GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
  AGENTES_CAIXA: ${{ vars.AGENTES_CAIXA }}
  GRAPH_SITE_ID: ${{ vars.GRAPH_SITE_ID }}
  GRAPH_PASTA: ${{ vars.GRAPH_PASTA }}
  CENTRAL_SAL: ${{ secrets.CENTRAL_SAL }}  # sal do índice de negócios ativos (mesmo valor da Central e da esteira)
concurrency:
  group: agentes-estado
  cancel-in-progress: false

jobs:
  rodar:
    if: ${{ vars.AGENTES_NUVEM == 'ligado' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - run: PARTNERS_MANUAL=1 ~/agentes-partners/bin/partners manha
      - if: always()
        run: python3 ~/agentes-partners/lib/estado.py subir
