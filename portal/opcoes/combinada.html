<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- PRÉVIA LOCAL. Na versão final (portal/index.html, gerada por portal/opcoes/gerar_index.py) saem estas linhas de cabeçalho
     e o exemplo-dados.js: sem window.EX a página lê dados.json, diretorio.json e o db do Artifact. -->
<script src="exemplo-dados.js"></script>
<title>Central Partners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Central Partners v3 (design aprovado em 23/10/2026: "cockpit escuro"). Design System Save v0.5.
   Layout: barra lateral fixa (navegação + "Fale com uma área" + perfil), barra superior com caminho, busca ⌘K e "Novo pedido";
   no celular, cabeçalho curto e menu inferior. Escuro é o padrão do painel; o botão de tema alterna para o claro.
   O ouro é a única cor de destaque: botão principal, seleção, prazo perto e linha das sparklines. */
:root {
  --fundo:#000000; --sup:#0B0B0C; --sup-2:#141416; --poco:#060607; --hover:#101012;
  --linha:#1C1C20; --linha-2:#26262B; --linha-3:#3A3A40; --linha-fina:#16161A;
  --texto:#F2F2F3; --texto-2:#C9C9CF; --texto-3:#A3A3AB; --texto-4:#8A8A93; --apagado:#4A4A52; --ponto:#7C7C85;
  --ouro:#F3CD60; --ouro-texto:#F3CD60; --ouro-linha:#F3CD60; --ouro-hover:#FFE08A; --ouro-suave:rgba(243,205,96,.12); --sobre-ouro:#000000;
  --erro:#E5675F; --veu:rgba(0,0,0,.72); --sombra:rgba(0,0,0,.6);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --lado:248px; color-scheme:dark }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --fundo:#F6F7F9; --sup:#FFFFFF; --sup-2:#F1F2F5; --poco:#F6F7F9; --hover:#F7F8FA;
  --linha:#E6E8EC; --linha-2:#DEE0E5; --linha-3:#C9CCD3; --linha-fina:#EEF0F3;
  --texto:#0F1115; --texto-2:#2E323A; --texto-3:#4A4F58; --texto-4:#5F646E; --apagado:#A9ADB5; --ponto:#838892;
  --ouro:#F3CD60; --ouro-texto:#B58A1F; --ouro-linha:#B58A1F; --ouro-hover:#E8BC4C; --ouro-suave:#FBF1D7; --sobre-ouro:#0F1115;
  --erro:#C5221F; --veu:rgba(15,17,21,.32); --sombra:rgba(15,17,21,.14); color-scheme:light } }
:root[data-theme="light"] {
  --fundo:#F6F7F9; --sup:#FFFFFF; --sup-2:#F1F2F5; --poco:#F6F7F9; --hover:#F7F8FA;
  --linha:#E6E8EC; --linha-2:#DEE0E5; --linha-3:#C9CCD3; --linha-fina:#EEF0F3;
  --texto:#0F1115; --texto-2:#2E323A; --texto-3:#4A4F58; --texto-4:#5F646E; --apagado:#A9ADB5; --ponto:#838892;
  --ouro:#F3CD60; --ouro-texto:#B58A1F; --ouro-linha:#B58A1F; --ouro-hover:#E8BC4C; --ouro-suave:#FBF1D7; --sobre-ouro:#0F1115;
  --erro:#C5221F; --veu:rgba(15,17,21,.32); --sombra:rgba(15,17,21,.14); color-scheme:light }
.logo-claro{display:none}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .logo-claro{display:block} :root:not([data-theme="dark"]) .logo-escuro{display:none} }
:root[data-theme="light"] .logo-claro{display:block} :root[data-theme="light"] .logo-escuro{display:none}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--fundo)}
button{font:inherit;color:inherit}
a{color:var(--ouro-texto);text-underline-offset:3px;font-weight:500} a:hover{color:var(--ouro-hover)}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px} [tabindex="-1"]:focus{outline:none}
h1,h2,h3{text-wrap:balance}
.ic{width:18px;height:18px;flex:none}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.rot{font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--texto-3)}
.sub{color:var(--texto-4);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tit{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quebra{white-space:normal;overflow-wrap:anywhere}

/* ---------- barra lateral ---------- */
.lado{position:fixed;inset:0 auto 0 0;width:var(--lado);background:var(--fundo);border-right:1px solid var(--linha);display:flex;flex-direction:column;gap:22px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:40;overflow-y:auto}
.lado .marca{padding:0 8px;display:flex;align-items:center;min-height:24px} .lado .marca img{height:22px;width:auto}
.grupo-m{display:flex;flex-direction:column;gap:2px}
.grupo-m .rot{padding:0 10px 8px;letter-spacing:.12em;color:var(--texto-4)}
.menu a,.fixadas a{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--texto-3);font-weight:400;font-size:14px}
.menu a:hover,.fixadas a:hover{background:var(--sup-2);color:var(--texto)}
.menu a[aria-current="page"]{background:var(--linha);color:var(--texto);font-weight:500}
.menu a span.t,.fixadas a span.t{flex:1;min-width:0}
.cont{font:600 11px var(--mono);min-width:22px;padding:1px 6px;border-radius:999px;background:var(--ouro);color:var(--sobre-ouro);text-align:center}
.fixadas a{color:var(--texto-2)}
.sig{width:24px;height:24px;border-radius:6px;background:var(--sup-2);border:1px solid var(--linha-2);color:var(--ouro-texto);font:600 11px var(--mono);display:flex;align-items:center;justify-content:center;flex:none}
.sig.g{width:36px;height:36px;border-radius:9px;font-size:12px}
.sig.forte{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro)}
.perfil{margin-top:auto;display:grid;gap:10px;padding:12px 10px;border:1px solid var(--linha);border-radius:10px;background:var(--sup)}
.perfil .quem{display:flex;align-items:center;gap:10px}
.perfil .quem span{display:flex;flex-direction:column;line-height:1.3;min-width:0} .perfil .quem b{font-weight:600} .perfil .quem small{font-size:12px;color:var(--texto-3)}
.av{width:32px;height:32px;border-radius:50%;background:var(--ouro);color:var(--sobre-ouro);font:700 12.5px var(--sans);display:flex;align-items:center;justify-content:center;flex:none}
.av.vazio-av{background:var(--sup-2);color:var(--texto-3);border:1px solid var(--linha-3)}
.av.p{width:24px;height:24px;font:600 10px var(--sans);background:var(--linha);color:var(--texto);border:1px solid var(--linha-3)}
.av.m{width:30px;height:30px;font-size:12px;background:var(--linha);color:var(--texto);border:1px solid var(--linha-3)}
.perfil label{display:grid;gap:4px;font-size:12px;color:var(--texto-3)}
.perfil select{min-height:34px;padding:4px 8px;font-size:13px}
.veu-menu{display:none}

/* ---------- barra superior ---------- */
.corpo{margin-left:var(--lado);min-height:100vh;min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--fundo);border-bottom:1px solid var(--linha);
  padding-block:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.migalha{font-size:13px;color:var(--texto-3);display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0}
.migalha b{color:var(--texto);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .migalha i{font-style:normal;color:var(--apagado)}
.topo img.logo-m{display:none!important}
.busca-g{flex:0 1 380px;min-width:200px;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1px solid var(--linha-2);border-radius:10px;background:var(--sup);color:var(--texto-4);font-size:14px;cursor:pointer;text-align:left}
.busca-g:hover{border-color:var(--linha-3)} .busca-g .txt-l{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .busca-g .txt-c{display:none}
kbd{font:500 11px var(--mono);padding:2px 6px;border:1px solid var(--linha-2);border-radius:5px;color:var(--texto-3);background:transparent}
.tag-previa{font:500 11px var(--mono);letter-spacing:.06em;padding:4px 8px;border:1px dashed var(--apagado);border-radius:6px;color:var(--texto-3);white-space:nowrap}
.dir{display:flex;align-items:center;gap:8px}
.icbtn{position:relative;width:40px;height:40px;border:1px solid var(--linha-2);border-radius:10px;background:var(--sup);color:var(--texto-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icbtn:hover{border-color:var(--linha-3);color:var(--texto)}
.icbtn .pt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--ouro);color:var(--sobre-ouro);font:600 10.5px/18px var(--mono);text-align:center;padding:0 4px}
.av-m{display:none}
.faixa{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:0;padding-block:8px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px dashed var(--linha-2);font-size:12.5px;color:var(--texto-3)}
.faixa b{color:var(--texto);font-weight:600}

/* ---------- botões e campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ouro);background:var(--ouro);color:var(--sobre-ouro);font:600 14px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ouro-hover);border-color:var(--ouro-hover);color:var(--sobre-ouro)} .btn .ic{width:16px;height:16px}
.btn.sec{background:var(--sup-2);border-color:var(--linha-3);color:var(--texto);font-weight:500} .btn.sec:hover{border-color:var(--texto-4);color:var(--texto)}
.btn.linha{background:transparent;border-color:var(--ouro);color:var(--ouro-texto);font-weight:500} .btn.linha:hover{background:var(--ouro-suave)}
.btn.perigo{background:transparent;border-color:var(--erro);color:var(--erro);font-weight:500}
.btn.peq{min-height:32px;padding:0 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--ouro-texto);font-size:13px;cursor:pointer;min-height:32px;padding:0;text-decoration:none;font-weight:500}
.lnk:hover{color:var(--ouro-hover)}
select,input,textarea{font:14px/1.4 var(--sans);border:1px solid var(--linha-2);border-radius:10px;padding:9px 12px;min-height:40px;background:var(--poco);color:var(--texto);width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--texto-4)}
select.f{width:auto;min-height:34px;padding:0 10px;font-size:13px;background:var(--sup)}
textarea{min-height:96px;resize:vertical}
label{display:grid;gap:6px;font-weight:500;font-size:13.5px} label small{color:var(--texto-4);font-weight:400}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--linha);border-radius:10px;background:var(--sup)}
.seg button{border:0;border-radius:7px;background:transparent;color:var(--texto-3);min-height:30px;padding:0 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--linha);color:var(--texto)} .seg .n,.pilulas .n{font:500 11.5px var(--mono);opacity:.8}
.pilulas{display:flex;flex-wrap:wrap;gap:6px}
.pilulas button{min-height:34px;padding:0 14px;border:1px solid var(--linha-2);border-radius:999px;background:transparent;color:var(--texto-2);font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pilulas button[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1.6 var(--mono);padding:1px 8px;border-radius:6px;border:1px solid var(--linha-2);color:var(--texto-2);white-space:nowrap;background:transparent}
.chip.area{font-family:var(--sans);font-size:12px;background:var(--sup-2)}
.chip.p::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--texto-4);flex:none}
.chip.fila::before{background:transparent;border:1.5px solid var(--ponto)} .chip.analise::before{background:var(--texto-2)}
.chip.aprovar,.chip.forte{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro);font-weight:600} .chip.aprovar::before{background:var(--sobre-ouro)}
.chip.concluido{color:var(--texto-3)} .chip.concluido::before{background:var(--apagado)}
.chip.urg{border-color:var(--ouro);color:var(--ouro-texto);font-weight:600} .chip.urg::before{content:"!";font-weight:700}
.ponto{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ponto)} .ponto.ouro{background:var(--ouro)}
.nota{border:1px dashed var(--linha-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--texto-3)}
.nota b{color:var(--texto)}
.aviso{border:1px solid var(--ouro);background:var(--ouro-suave);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--texto)}
.vazio{padding:20px 18px;color:var(--texto-3)}

/* ---------- páginas ---------- */
.pag{flex:1;width:100%;max-width:1360px;display:flex;flex-direction:column;gap:24px;padding-block:28px 64px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.pag>*{min-width:0}
.pag-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.pag-cab>div{min-width:0}
.pag-cab h1{margin:4px 0 0;font-size:26px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.pag-cab h1.g{font-size:28px}
.pag-cab p{margin:6px 0 0;color:var(--texto-3);max-width:68ch}
.painel{border:1px solid var(--linha);border-radius:14px;background:var(--sup);overflow:hidden;min-width:0}
.painel-cab{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--linha)}
.painel-cab h2{margin:0;font-size:15px;font-weight:600}
.painel-corpo{padding:16px 18px;display:grid;gap:12px}
details.painel>summary{list-style:none} details.painel>summary::-webkit-details-marker{display:none}
details.painel>summary h2::after{content:" +";color:var(--texto-4);font-weight:400} details.painel[open]>summary h2::after{content:" −"}
details.painel:not([open])>summary{border-bottom:0}
.grade-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px;align-items:start}
.pilha{display:grid;gap:16px;min-width:0}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{border:1px solid var(--linha);border-radius:14px;background:var(--sup);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.kpi{cursor:pointer} .kpi:hover{border-color:var(--linha-3)}
.kpi .k-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--texto-3)}
.kpi .k-meio{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:34px}
.kpi strong{font:500 34px/1 var(--mono);letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--texto)}
.kpi.destaque strong{color:var(--ouro-texto)}
.kpi small{font-size:12.5px;color:var(--texto-4)}
.spark{flex:none;overflow:visible}
/* linhas de lista */
.linha-a{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--linha-fina);min-width:0}
.linha-a:last-child{border-bottom:0} .linha-a:hover{background:var(--hover)}
.linha-a .meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.linhas{display:grid}
.lh{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--linha-fina);min-width:0;color:inherit;font:inherit}
.lh>*{min-width:0} .lh:last-child{border-bottom:0}
.lh.cab{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--texto-4);padding-block:10px;border-bottom:1px solid var(--linha)}
button.lh{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linha-fina);cursor:pointer}
button.lh:hover,div.lh:not(.cab):hover{background:var(--hover)}
.dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0} .dl dt{color:var(--texto-4)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere;color:var(--texto-2)}
/* janelas */
.janela{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--linha-fina)} .janela:last-child{border-bottom:0}
.dias{font:600 12px var(--mono);text-align:center;padding:6px 0;border-radius:8px;border:1px solid var(--linha-2);color:var(--texto-2)}
.dias.perto{background:var(--ouro);border-color:var(--ouro);color:var(--sobre-ouro)}
.janela .base{font:500 12px var(--mono);color:var(--texto-3);text-align:right;max-width:180px}
/* tabela do time */
.rolagem{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
table.t th{text-align:left;font:500 11px var(--mono);letter-spacing:.1em;color:var(--texto-4);padding:10px 12px;text-transform:uppercase}
table.t th:first-child,table.t td:first-child{padding-left:18px} table.t th:last-child,table.t td:last-child{padding-right:18px}
table.t td{padding:14px 12px;border-top:1px solid var(--linha-fina);color:var(--texto-2);vertical-align:middle}
table.t tr:hover td{background:var(--hover)}
table.t .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--texto)}
.pessoa{display:flex;align-items:center;gap:10px} .pessoa span{display:flex;flex-direction:column;line-height:1.3} .pessoa b{font-weight:500;color:var(--texto)} .pessoa small{font-size:12px;color:var(--texto-4)}
.barra{display:flex;align-items:center;gap:10px} .barra i{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--linha);overflow:hidden;display:block}
.barra i b{display:block;height:100%;border-radius:3px;background:var(--ouro)} .barra span{font:500 12px var(--mono);color:var(--texto-2);width:36px;text-align:right}
/* kanban */
.barra-f{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.coluna{border:1px solid var(--linha);border-radius:14px;background:var(--poco);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.coluna h3{margin:0;padding:4px 6px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.coluna h3 .t{flex:1} .coluna h3 .mono{color:var(--texto-4)}
.ticket{border:1px solid var(--linha);border-radius:10px;background:var(--sup);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%}
.ticket:hover{border-color:var(--linha-3)}
.ticket .t-topo{display:flex;justify-content:space-between;gap:8px;font:400 11px var(--mono);color:var(--texto-4)}

    <div class="acoes" style="margin-top:12px"><a class="btn" href="#area/${esc(a.skill)}/pedido">${icone("mais")}Fazer pedido</a></div>`;

  return `<div class="chat" id="chat-msgs">${c.turnos.length ? c.turnos.map((t, i) => t.role === "user" ? `<div class="msg eu">${esc(t.content)}</div>` : `<div class="msg ag ${t.erro ? "erro" : ""}"><span class="quem">Agentes · ${esc(a.nome)}${t.parcial ? " · interrompida" : ""}</span><div id="${i === c.turnos.length - 1 ? "ultima" : ""}">${t.content ? md(t.content) : "<p>Pensando…</p>"}</div></div>`).join("")

  return `<aside class="conversa" id="conversa" aria-label="Conversa com ${esc(a.nome)}"><div class="cv-cab"><span class="sig forte g" aria-hidden="true">${esc(sigla(a.nome))}</span>

function redesenharChat(sk) { const a = area(sk), el = $("#chat-area"); if (!el || !a) return; el.innerHTML = htmlChat(a); const c = chatDe(sk);

  if (pe) pe.disabled = c.rodando || !c.turnos.some(t => t.role === "assistant" && t.content && !t.erro); const box = $("#chat-corpo") || $("#g-conteudo"); if (box) box.scrollTop = box.scrollHeight }

      onText: ({text}) => { resp.content = text; const u = $("#ultima"); if (u) { u.innerHTML = md(text); const box = $("#chat-corpo") || $("#g-conteudo"); if (box) box.scrollTop = box.scrollHeight } }});

  } catch (e) {

    else { resp.content = code === "refused" ? "" : (e.text || ""); if (!resp.content) c.turnos.pop(); c.aviso = ERROS_CHAT[code] || ERROS_CHAT.upstream_error }

}

  if (e.target.id === "f-chat") { e.preventDefault(); const t = $("#chat-in"); const v = t.value; t.value = ""; perguntar(e.target.dataset.area, v) }
  if (e.target.id === "f-apont") { e.preventDefault(); if (!$("#a-desc").value.trim()) return $("#a-desc").focus();
    if (!Fonte.pode() || !S.eu) return; Fonte.criar("apontamentos", {pessoa: S.eu, por_id: S.meuId, data: agora(), descricao: $("#a-desc").value.trim(), tipo: $("#a-tipo").value, minutos: Number($("#a-min").value) || 0, ponte: $("#a-ponte").checked}).then(() => { toast("Tarefa registrada"); $("#a-desc").value = "" }, () => toast("Não consegui registrar a tarefa")) }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#f-chat").requestSubmit() }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); paleta() }
  if (e.key === "Escape") {
    if ($("#camada").innerHTML) { if ($("#camada .paleta, #camada .pop")) $("#camada").innerHTML = ""; else fechar() }
    else if (document.body.classList.contains("menu-aberto")) document.body.classList.remove("menu-aberto");
    else { const {r, p} = rota(); if ((r === "area" && p[1]) || r === "wa" || r === "wachamado") fechar() } }
});
document.addEventListener("input", e => {
  if (e.target.id === "q-onde") { $("#res-onde").innerHTML = resOnde(e.target.value) }
  if (e.target.id === "q-wa") { S.wa.q = e.target.value; $("#res-wa").innerHTML = listaWa() }
  if (e.target.id === "q-area") { S.novo.busca = e.target.value; $("#lista-areas").innerHTML = listaAreasNovo() }
  if (e.target.id === "p-precisa") S.novo.texto = e.target.value;
  if (e.target.id === "p-contexto") S.novo.contexto = e.target.value;
});
document.addEventListener("change", e => {
  if (e.target.id === "sou") { if (!Fonte.previa) return; S.eu = perfil(e.target.value); lsSet("sou", S.eu || ""); abrir() }
  if (e.target.id === "f-area") { S.f.area = e.target.value; abrir() } if (e.target.id === "f-pessoa") { S.f.pessoa = e.target.value; abrir() }
  if (e.target.id === "k-col") { S.kCol = e.target.value; abrir() }
  if (e.target.id === "wa-pessoa") { S.wa.pessoa = e.target.value; abrir() }
  if (e.target.id === "p-entrega") S.novo.entrega = e.target.value;
});
window.addEventListener("hashchange", abrir);
/* A pessoa está escrevendo? (foco num campo, texto digitado na gaveta, na conversa, no chamado ou no registro de tarefa, busca ou notificações abertas)
   Nesse caso a atualização do db só refaz a moldura; a tela é refeita quando ela sai do campo. */
function editando() {
  const a = document.activeElement;
  if (a && a.matches?.("input,textarea,select") && a.closest("#pag,#camada")) return true;
  if ($("#camada .paleta, #camada .pop")) return true;
  return [...document.querySelectorAll("#camada textarea, #camada input:not([type=search]), #chat-in, #wa-det textarea, #wa-det input, #f-apont input[type=text], #a-desc")].some(el => el.value !== el.defaultValue);
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.pendente && !editando()) { S.pendente = false; abrir() } }, 0));

async function iniciar() {
  const t = lsGet("tema"); document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "dark";  /* painel: escuro por padrão */
  const v = lsGet("vista"); if (v === "lista" || v === "quadro") S.vista = v;
  $("#ic-busca").innerHTML = icone("onde"); $("#novo-t").innerHTML = icone("mais") + "Novo pedido";
  try { S.M = await Fonte.carregar() } catch (e) { $("#pag").innerHTML = `<div class="vazio">Não consegui carregar os dados da Central. Recarregue a página em alguns segundos.</div>`; return }
  S.eu = Fonte.previa ? perfil(lsGet("sou")) || "daniela" : null;
  abrir();
  await Fonte.conectar();
  const eu = await Fonte.quemSou(); S.meuId = eu.id; if (eu.chave && !Fonte.previa) { S.eu = eu.chave; S.identificado = true }
  if (Fonte.db) {
    const erro = () => toast("Não consegui carregar os registros agora");
    const refaz = () => { if (editando()) { moldura(rota().r); S.pendente = true } else abrir() };
    Fonte.ouvir("pedidos", "criado_em", 300, xs => { S.M.pedidos = xs; refaz() }, erro);
    Fonte.ouvir("acoes_demandas", null, 500, xs => { S.acoes = Object.fromEntries(xs.map(d => [d.id, d])); refaz() }, erro);
    Fonte.ouvir("recuperador", null, 500, xs => { S.recup = Object.fromEntries(xs.map(d => [d.id, d])); refaz() }, erro);
    Fonte.ouvir("conselho", null, 200, xs => { S.conselho = Object.fromEntries(xs.map(d => [d.id, d])); refaz() }, erro);
    Fonte.ouvir("apontamentos", "data", 300, xs => { S.apont = xs; refaz() }, erro);
    Fonte.ouvir("chamados", "proposto_em", 300, xs => { S.M.chamados = xs; refaz() }, erro);
  }
  abrir();
}
iniciar();
</script>
</body></html>
