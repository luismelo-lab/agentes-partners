<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- PRÉVIA LOCAL. Na versão final (portal/index.html) saem esta linha de cabeçalho e o exemplo-dados.js:
     sem window.EX a página lê dados.json, diretorio.json e o db do Artifact. -->
<script src="exemplo-dados.js"></script>
<title>Central Partners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Central Partners v2 (versão combinada, 23/10/2026). Design System Save v0.5.
   Casca de sistema: barra lateral fixa + barra superior com busca global (Ctrl+K), notificações e perfil;
   tabelas com filtros e painel lateral de detalhe. Áreas em cartões de serviço com página própria.
   Mesa do Luis com KPIs, filas em kanban e janelas de receita. Claro por padrão (time), alternância para escuro. */
:root {
  --fundo:#F6F7F9; --fundo-2:#F1F2F5; --cartao:#FFFFFF; --borda:#E6E8EC; --borda-3:#C9CCD3;
  --texto:#0F1115; --texto-2:#4A4F58; --ouro:#F3CD60; --ouro-texto:#B58A1F; --ouro-suave:#FBF1D7;
  --sucesso:#1E8E3E; --alerta:#B5790F; --erro:#C5221F; --sombra:rgba(15,17,21,.14); --veu:rgba(15,17,21,.32); --hover:#FAFAFB;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light }
:root[data-theme="dark"] {
  --fundo:#000000; --fundo-2:#111111; --cartao:#171717; --borda:#2A2A2A; --borda-3:#3A3A3A;
  --texto:#F5F5F5; --texto-2:#A1A1A1; --ouro:#F3CD60; --ouro-texto:#F3CD60; --ouro-suave:rgba(243,205,96,.12);
  --sucesso:#44C653; --alerta:#E8B34A; --erro:#D64545; --sombra:rgba(0,0,0,.6); --veu:rgba(0,0,0,.6); --hover:#1E1E1E; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--texto);text-decoration:underline;text-decoration-color:var(--ouro-texto);text-underline-offset:3px;font-weight:500}
:focus-visible{outline:3px solid var(--ouro-texto);outline-offset:2px} [tabindex="-1"]:focus{outline:none}
.ic{width:20px;height:20px;flex:none}
.logo-escuro{display:none} :root[data-theme="dark"] .logo-claro{display:none} :root[data-theme="dark"] .logo-escuro{display:block}
/* barra lateral */
.lado{position:fixed;inset:0 auto 0 0;width:236px;overflow:hidden;background:var(--cartao);border-right:1px solid var(--borda);display:flex;flex-direction:column;z-index:30;padding-left:env(safe-area-inset-left,0px)}
.lado .marca{height:64px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding:0 20px;border-bottom:1px solid var(--borda)}
.lado .marca img{height:20px;width:auto} .lado .marca span{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texto-2);white-space:nowrap}
.menu{padding:10px;display:grid;gap:2px}
.menu .grupo{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2);padding:14px 12px 6px}
.menu a{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:42px;border-radius:8px;text-decoration:none;color:var(--texto-2);font-weight:500;position:relative}
.menu a:hover{background:var(--fundo-2);color:var(--texto)}
.menu a[aria-current="page"]{background:var(--ouro-suave);color:var(--texto);font-weight:600}
.menu a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--ouro)}
.menu .cont{margin-left:auto;font:600 12px var(--mono);background:var(--texto);color:var(--cartao);border-radius:10px;padding:0 7px}
.lado .perfil{margin-top:auto;border-top:1px solid var(--borda);padding:14px 16px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:#0F1115;color:#F3CD60;border:1px solid var(--borda-3);display:grid;place-items:center;font:600 12.5px var(--mono);flex:none}
.av.p{width:26px;height:26px;font-size:10.5px}
.perfil label{flex:1;display:grid;gap:2px;font-size:12px;color:var(--texto-2);font-weight:500}
.perfil select{min-height:36px;padding:4px 8px}
/* barra superior */
.corpo{margin-left:236px;min-height:100vh}
.topo{position:sticky;top:0;z-index:20;height:64px;background:var(--cartao);border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:10px;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 24px}
.icbtn.btn-menu{display:none}
.busca-g{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;height:42px;border:1px solid var(--borda-3);border-radius:10px;background:var(--fundo);padding:0 12px;color:var(--texto-2);cursor:text;text-align:left;min-width:0}
.busca-g span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .busca-g .txt-c{display:none} .topo img.logo-m{display:none!important}
.busca-g kbd{margin-left:auto;font:500 11.5px var(--mono);border:1px solid var(--borda-3);border-radius:5px;padding:1px 6px;background:var(--cartao);color:var(--texto-2)}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:6px}
.icbtn{width:42px;height:42px;border-radius:10px;border:1px solid transparent;background:none;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--texto)}
.icbtn:hover{background:var(--fundo-2)}
.icbtn .pt{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--erro);color:#FFFFFF;font:600 11px/18px var(--mono);text-align:center;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--ouro);background:var(--ouro);color:#0F1115;font:600 14px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.96)} .btn .ic{width:18px;height:18px}
.btn.sec{background:var(--cartao);border-color:var(--borda-3);color:var(--texto)} .btn.perigo{background:var(--cartao);border-color:var(--erro);color:var(--erro)}
.btn.peq{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.faixa-previa{background:var(--ouro-suave);border-bottom:1px solid var(--ouro);font-size:13.5px;padding:8px 24px;display:flex;gap:8px;flex-wrap:wrap}
/* páginas */
.pag{padding:28px 24px 64px;max-width:1280px;display:grid;gap:22px}
.pag>*{min-width:0}
.pag-cab{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.pag-cab>div{min-width:0}
.pag-cab h1{margin:2px 0 0;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.pag-cab p{margin:6px 0 0;color:var(--texto-2);max-width:72ch}
.rot{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2)}
.migalha{font-size:13.5px;color:var(--texto-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap} .migalha a{color:var(--texto-2)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:14px 16px;display:grid;gap:2px;text-align:left;cursor:default}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--borda-3)}
.kpi strong{font:600 28px/1.15 var(--mono);font-variant-numeric:tabular-nums} .kpi small{color:var(--texto-2);font-size:13px}
.kpi.destaque{border-color:var(--ouro);box-shadow:inset 0 3px 0 var(--ouro)}
.painel{background:var(--cartao);border:1px solid var(--borda);border-radius:12px;overflow:hidden;min-width:0}
.painel-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--borda)}
.painel-cab h2{margin:0;font-size:16px;font-weight:600}
.painel-corpo{padding:16px;display:grid;gap:12px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--borda-3);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--cartao);padding:0 12px;min-height:36px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--borda);display:inline-flex;gap:6px;align-items:center}
.seg button:last-child{border-right:0} .seg button[aria-pressed="true"]{background:var(--texto);color:var(--cartao)}
.seg .n{font:500 12px var(--mono);opacity:.8}
select,input,textarea{font:15px/1.4 var(--sans);border:1px solid var(--borda-3);border-radius:8px;padding:9px 12px;min-height:42px;background:var(--cartao);color:var(--texto);width:100%;min-width:0}
select.f{width:auto;min-height:36px;padding:0 10px;font-size:13.5px}
textarea{min-height:96px;resize:vertical}
label{display:grid;gap:6px;font-weight:500;font-size:14px} label small{color:var(--texto-2);font-weight:400}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.linhas{display:grid}
.lh{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--borda);min-width:0}
.lh>*{min-width:0} .lh:last-child{border-bottom:0}
.lh.cab{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2);padding-block:9px;background:var(--fundo)}
button.lh{width:100%;text-align:left;background:var(--cartao);border:0;border-bottom:1px solid var(--borda);cursor:pointer}
button.lh:hover{background:var(--hover)}
.tit{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--texto-2);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quebra{white-space:normal}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1.6 var(--sans);padding:1px 9px;border-radius:4px;background:var(--fundo-2);border:1px solid var(--borda);white-space:nowrap;color:var(--texto)}
.chip.p::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--texto-2);flex:none}
.chip.fila::before{background:transparent;border:1.5px solid var(--texto-2);width:7px;height:7px}
.chip.analise::before{background:var(--alerta)} .chip.aprovar{background:var(--ouro-suave);border-color:var(--ouro)} .chip.aprovar::before{background:var(--ouro-texto)}
.chip.concluido::before{background:var(--sucesso)} .chip.urg{color:var(--erro);border-color:var(--erro);background:var(--cartao)}
.duas{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.pilha{display:grid;gap:22px;min-width:0}
.vazio{padding:18px 16px;color:var(--texto-2)}
.nota{background:var(--fundo-2);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--texto-2)}
.aviso{background:var(--ouro-suave);border:1px solid var(--ouro);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--texto)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.coluna{background:var(--fundo-2);border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.coluna h3{margin:0;padding:2px 4px 4px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.coluna h3 .mono{margin-left:auto;color:var(--texto-2)}
.ticket{background:var(--cartao);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;display:grid;gap:6px;text-align:left;cursor:pointer;width:100%}
.ticket:hover{border-color:var(--borda-3)}
.ticket .txt{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticket .rodape{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texto-2)}
.ticket .rodape .mono{font-size:12px;margin-left:auto}
.seg-col{display:none}
/* áreas como serviços */
.bloco{display:grid;gap:10px}
.servicos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.servico{background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:16px;display:grid;grid-template-rows:auto 1fr auto;gap:8px;text-align:left;cursor:pointer;min-height:168px}
.servico:hover{border-color:var(--ouro);box-shadow:0 4px 12px var(--sombra)}
.servico .topo-s{display:flex;align-items:center;gap:10px}
.servico .sig{width:36px;height:36px;border-radius:8px;background:var(--ouro-suave);color:var(--texto);display:grid;place-items:center;font:600 13px var(--mono);flex:none;border:1px solid var(--ouro)}
.servico strong{font-size:15.5px;font-weight:600;line-height:1.25}
.servico p{margin:0;color:var(--texto-2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.servico .base{display:flex;gap:2px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--texto-2);border-top:1px solid var(--borda);padding-top:8px}
.area-cab{background:var(--cartao);border:1px solid var(--borda);border-radius:12px;padding:20px;display:grid;gap:12px;box-shadow:inset 0 4px 0 var(--ouro)}
.area-cab h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.area-cab p{margin:0;max-width:78ch}
.esps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.esp{border:1px solid var(--borda);border-radius:10px;padding:12px;display:grid;gap:4px;background:var(--cartao)}
.esp b{font-size:14px} .esp span{font-size:13px;color:var(--texto-2)}
.ent{display:grid;gap:4px;padding:12px 16px;border-bottom:1px solid var(--borda)} .ent:last-child{border-bottom:0}
.ent .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--texto-2)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px;margin:0} .dl dt{color:var(--texto-2)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.janela{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--borda);align-items:start} .janela:last-child{border-bottom:0}
.dias{font:600 13px var(--mono);border-radius:6px;padding:4px 8px;text-align:center;min-width:64px;background:var(--fundo-2);border:1px solid var(--borda)}
.dias.perto{background:var(--ouro-suave);border-color:var(--ouro)}
/* gaveta */
.veu{position:fixed;inset:0;background:var(--veu);z-index:40}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--cartao);z-index:41;box-shadow:-12px 0 32px var(--sombra);display:flex;flex-direction:column;padding-right:env(safe-area-inset-right,0px)}
.gaveta>header{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--borda);min-height:64px}
.gaveta>header h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0}
.gaveta>header .sub{margin-top:2px}
.gaveta .conteudo{padding:18px 20px 28px;overflow:auto;display:grid;gap:16px;align-content:start;flex:1}
.gaveta .rodape{border-top:1px solid var(--borda);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px}
.linha-tempo{list-style:none;margin:0;padding:0}
.linha-tempo li{position:relative;padding:0 0 14px 22px;font-size:14px}
.linha-tempo li::before{content:"";position:absolute;left:4px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--texto-2)}
.linha-tempo li::after{content:"";position:absolute;left:7.5px;top:17px;bottom:0;width:1px;background:var(--borda-3)}
.linha-tempo li:last-child::after{display:none} .linha-tempo li:last-child::before{background:var(--ouro);box-shadow:0 0 0 3px var(--ouro-suave)}
.resp{border-left:3px solid var(--ouro);padding:2px 0 2px 14px;display:grid;gap:6px;font-size:14.5px} .resp p{margin:0} .resp ul{margin:0;padding-left:18px} .resp h4{margin:6px 0 0;font-size:14px}
.lista-areas{display:grid;gap:2px;max-height:280px;overflow:auto;border:1px solid var(--borda);border-radius:8px;padding:4px}
.lista-areas button{display:grid;text-align:left;border:0;background:none;border-radius:6px;padding:8px 10px;cursor:pointer;gap:1px}
.lista-areas button:hover{background:var(--fundo-2)} .lista-areas button[aria-pressed="true"]{background:var(--ouro-suave);box-shadow:inset 3px 0 0 var(--ouro)}
.lista-areas small{color:var(--texto-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista-areas .g{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2);padding:8px 10px 2px}
/* conversa */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:12px;font-size:14.5px;display:grid;gap:6px}
.msg p{margin:0} .msg ul{margin:0;padding-left:18px}
.msg.eu{align-self:flex-end;background:var(--texto);color:var(--cartao);border-bottom-right-radius:4px}
.msg.ag{align-self:flex-start;background:var(--fundo-2);border:1px solid var(--borda);border-bottom-left-radius:4px}
.msg.ag .quem{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2)}
.msg.erro{border-color:var(--erro)}
.sugestoes{display:flex;flex-wrap:wrap;gap:8px}
.sugestoes button{border:1px solid var(--borda-3);background:var(--cartao);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;text-align:left}
.compor{display:grid;gap:8px;border-top:1px solid var(--borda);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.compor textarea{min-height:64px}
/* paleta e notificações */
.paleta{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:var(--cartao);border-radius:14px;z-index:51;box-shadow:0 24px 64px var(--sombra);overflow:hidden;border:1px solid var(--borda)}
.paleta input{border:0;border-bottom:1px solid var(--borda);border-radius:0;min-height:56px;font-size:17px;padding:0 18px}
.paleta .res{max-height:52vh;overflow:auto;padding:6px}
.paleta .res button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;text-align:left;border:0;background:none;border-radius:8px;padding:9px 12px;cursor:pointer;align-items:center}
.paleta .res button:hover{background:var(--fundo-2)} .paleta .res .sub{grid-column:2}
.pop{position:fixed;top:60px;right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 32px));background:var(--cartao);border:1px solid var(--borda);border-radius:12px;box-shadow:0 16px 40px var(--sombra);z-index:51;overflow:hidden}
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);background:var(--texto);color:var(--cartao);padding:12px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);transition:transform .2s}
.toast.mostra{transform:translateX(-50%);visibility:visible}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:1100px){ .kanban{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .lado{transform:translateX(-100%);transition:transform .2s} body.menu-aberto .lado{transform:none;box-shadow:12px 0 32px var(--sombra)}
  .corpo{margin-left:0} .icbtn.btn-menu{display:grid} .topo{padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));gap:4px}

      d.pessoa === S.eu ? `<button class="btn" data-acao="demanda" data-id="${esc(d.id)}" data-v="respondido">Respondi</button><button class="btn sec" data-acao="demanda" data-id="${esc(d.id)}" data-v="encaminhado">Encaminhei à área</button><button class="btn sec" data-acao="demanda" data-id="${esc(d.id)}" data-v="nao_e_demanda">Não é demanda</button>` : "") }
  if (r === "chamado") { const c = S.M.chamados.find(x => x.id === p[0]); if (c) { const pode = c.pessoa === S.eu && c.status === "proposto"; gaveta(esc(c.titulo_editado || c.titulo), esc(c.grupo || "Chamado"), `<div class="filtros"><span class="chip p ${c.status === "proposto" ? "aprovar" : "concluido"}">${esc(ST_CH[c.status] || c.status)}</span>${c.urgencia >= 4 ? `<span class="chip urg">Urgência ${esc(c.urgencia)}</span>` : ""}</div>
      ${pode ? `<label for="ct">Título</label><input id="ct" value="${esc(c.titulo_editado || c.titulo)}" maxlength="200"><label for="cd">Descrição</label><textarea id="cd" rows="7">${esc(c.descricao_editada || c.descricao)}</textarea><label for="cm">Motivo, se não for abrir <small>(ensina os agentes)</small></label><input id="cm" maxlength="300"><div class="nota">O chamado só vai ao GLPI depois que você aprova.</div>` : `<div class="resp">${md(c.descricao_editada || c.descricao)}</div>`}`,
      pode ? `<button class="btn" data-acao="chamado" data-id="${esc(c.id)}" data-v="aprovado">Aprovar e abrir no GLPI</button><button class="btn perigo" data-acao="chamado" data-id="${esc(c.id)}" data-v="recusado">Não abrir</button>` : "") } }
  if (r === "lote") { const l = S.M.lote.find(x => x.deal === p[0]); if (l) gaveta(esc(l.negocio), esc(l.parceiro), `<div class="filtros"><span class="chip">${esc(l.tipo)}</span><span class="chip">${esc(l.segmento)} · ${esc(l.uf)}</span></div><p style="margin:0">Potencial estimado ${mi(l.esperado)}, a validar caso a caso.</p>${l.hipotese ? `<div class="resp"><p>${esc(l.hipotese)}</p>${l.parecer ? `<p>Parecer: ${esc(l.parecer)}</p>` : ""}${l.documentos ? `<p>Pedir: ${esc(l.documentos)}</p>` : ""}</div>` : ""}${url(l.link) ? `<a href="${url(l.link)}" target="_blank" rel="noopener">Abrir no HubSpot</a>` : ""}${S.eu === "geovana" ? `<label for="r-m">Motivo ou observação</label><input id="r-m" maxlength="300">` : `<div class="nota">Quem decide o lote é a Geovana.</div>`}`,
      S.eu === "geovana" ? `<button class="btn" data-acao="lote" data-id="${esc(l.deal)}" data-v="Aprovar para reanálise">Aprovar para reanálise</button><button class="btn perigo" data-acao="lote" data-id="${esc(l.deal)}" data-v="Vetar">Vetar</button><button class="btn sec" data-acao="lote" data-id="${esc(l.deal)}" data-v="Precisa de dado">Precisa de dado</button>` : "") }
  if (r === "decisao") { const d = S.M.decisoes.find(x => x.id === p[0]); if (d) gaveta(esc(d.id), esc(d.data || "") + (d.ata ? " · " + esc(d.ata) : ""), `<p style="margin:0;font-size:16px">${esc(d.texto)}</p>${d.obs ? `<p class="sub quebra">${esc(d.obs)}</p>` : ""}${S.eu === "luis" ? `<label for="n-dec">Observação <small>(opcional)</small></label><input id="n-dec" maxlength="400">` : `<div class="nota">Só o Luis decide as decisões do Conselho.</div>`}`,
      S.eu === "luis" ? `<button class="btn" data-acao="decisao" data-id="${esc(d.id)}" data-v="aprovada">Aprovar</button><button class="btn sec" data-acao="decisao" data-id="${esc(d.id)}" data-v="aprovada com ajuste">Aprovar com ajuste</button><button class="btn perigo" data-acao="decisao" data-id="${esc(d.id)}" data-v="rejeitada">Rejeitar</button>` : "") }
  if (manter) { const q = $("#q-onde"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length) } }
}
function fechar() {
  const {r, p} = rota(); const volta = {pedido: "pedidos", novo: "pedidos", demanda: "mesa", chamado: "mesa", lote: "mesa", decisao: S.eu === "luis" ? "mesa" : "decisoes"}[r];
  if (r === "area" && p[1]) { const c = chatDe(p[0]); c.ctl?.abort(); location.hash = "area/" + p[0]; return }
  if (volta) location.hash = volta; else $("#camada").innerHTML = "";
}
function paleta() {
  $("#camada").innerHTML = `<div class="veu" data-fechar-p></div><div class="paleta" role="dialog" aria-modal="true" aria-label="Busca global"><input id="q-p" placeholder="Buscar área, entrega, pasta, rotina ou pedido" autocomplete="off" aria-label="Buscar"><div class="res" id="res-p"></div></div>`;
  const q = $("#q-p"); q.focus();
  const rodar = () => { const v = q.value.trim(), sv = sem(v); const ps = v ? S.M.pedidos.filter(p => sem((p.pid || p.id) + " " + p.campos?.precisa + " " + (p.entrega || "")).includes(sv)).slice(0, 4) : [];
    $("#res-p").innerHTML = (!v ? `<div class="vazio">Ex.: conferência de repasses, lote do Recuperador, ata do Conselho, P-0031.</div>` : "")
      + ps.map(p => `<button data-go="pedido/${esc(p.id)}"><span class="chip">Pedido</span><b>${esc(p.pid || p.id)} · ${esc(p.entrega || p.campos?.precisa)}</b><span class="sub">${esc(nomeArea(p.area))} · ${esc(rotFase(p))}</span></button>`).join("")
      + buscar(v, 10).map(r => `<button data-go="${r.area ? "area/" + esc(r.area) : "onde/" + esc(encodeURIComponent(r.titulo))}"><span class="chip">${esc(r.tipo)}</span><b>${esc(r.titulo)}</b><span class="sub">${esc(r.sub || "")}${r.onde ? " · " + esc(r.onde) : ""}</span></button>`).join("")
      + (v ? `<button data-go="onde/${esc(encodeURIComponent(v))}"><span class="chip">Todos</span><b>Ver todos os resultados em Onde está</b></button>` : "") };
  q.addEventListener("input", rodar); rodar();
}
function notificacoes() {
  const it = itensAcao(S.eu).slice(0, 6);
  $("#camada").innerHTML = `<div class="veu" data-fechar-p style="background:transparent"></div><div class="pop" role="dialog" aria-label="Notificações"><div class="painel-cab"><h2>Para você</h2><span class="sub">${pendentes(S.eu)} itens</span></div>
    <div class="linhas" style="--cols:minmax(0,1fr)">${it.map(i => `<button class="lh" data-go="${i.go}"><span><span class="tit">${esc(i.t)}</span><span class="sub">${esc(i.tipo)}</span></span></button>`).join("") || `<div class="vazio">${S.eu ? "Nada pendente." : "Escolha o seu perfil."}</div>`}</div></div>`;
}

/* ===================== Eventos ===================== */
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return }
  if (e.target.closest("[data-fechar]")) return fechar();
  if (e.target.closest("[data-fechar-p]")) { $("#camada").innerHTML = ""; return }
  const so = e.target.closest("[data-sou]"); if (so) { S.eu = so.dataset.sou; lsSet("sou", S.eu); abrir(); return }
  const fa = e.target.closest("[data-fase]"); if (fa) { S.f.fase = fa.dataset.fase; abrir(); return }
  const kp = e.target.closest("[data-kp]"); if (kp) { S.kPessoa = kp.dataset.kp; abrir(); return }
  const sl = e.target.closest("[data-sel]"); if (sl) { S.novo.sel = sl.dataset.sel; S.novo.entrega = ""; gNovo(); return }
  const pe = e.target.closest("[data-pedir]"); if (pe) { S.novo = {sel: pe.dataset.pedir, busca: "", entrega: pe.dataset.entrega || ""}; location.hash = "area/" + pe.dataset.pedir + "/pedido"; return }
  const q = e.target.closest("[data-q]"); if (q) { location.hash = "onde/" + encodeURIComponent(q.dataset.q); return }
  const sg = e.target.closest("[data-sug]"); if (sg) { const f = $("#f-chat"); if (f) perguntar(f.dataset.area, sg.dataset.sug); return }
  const dc = e.target.closest("[data-dec]"); if (dc) { decidirPedido(dc.dataset.id, dc.dataset.dec); return }
  const ac = e.target.closest("[data-acao]"); if (ac) { acao(ac.dataset.acao, ac.dataset.id, ac.dataset.v); return }
  if (e.target.closest("#enviar-pedido")) return enviarPedido(e.target.closest("#enviar-pedido").dataset.area);
  if (e.target.closest("#chat-parar")) { const f = $("#f-chat"); chatDe(f.dataset.area).ctl?.abort(); return }
  if (e.target.closest("#chat-pedido")) return chatParaPedido($("#f-chat").dataset.area);
  if (e.target.closest("#abrir-busca") || e.target.closest("#ir-busca")) return paleta();
  if (e.target.closest("#abrir-menu")) { document.body.classList.toggle("menu-aberto"); return }
  if (e.target.closest("#sino")) return notificacoes();
  if (e.target.closest("#tema")) { const d = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = d; lsSet("tema", d); moldura(rota().r); return }
});
document.addEventListener("submit", e => {
  if (e.target.id === "f-chat") { e.preventDefault(); const t = $("#chat-in"); const v = t.value; t.value = ""; perguntar(e.target.dataset.area, v) }
  if (e.target.id === "f-apont") { e.preventDefault(); if (!$("#a-desc").value.trim()) return $("#a-desc").focus();
    Fonte.criar("apontamentos", {pessoa: S.eu, data: agora(), descricao: $("#a-desc").value.trim(), tipo: $("#a-tipo").value, minutos: Number($("#a-min").value) || 0, ponte: $("#a-ponte").checked}).then(() => { toast("Tarefa registrada"); $("#a-desc").value = "" }, () => toast("Não consegui registrar a tarefa")) }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "chat-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#f-chat").requestSubmit() }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); paleta() }
  if (e.key === "Escape" && $("#camada").innerHTML) { if ($("#camada .paleta, #camada .pop")) $("#camada").innerHTML = ""; else fechar() }
});
document.addEventListener("input", e => {
  if (e.target.id === "q-onde") { $("#res-onde").innerHTML = resOnde(e.target.value) }
  if (e.target.id === "q-area") { S.novo.busca = e.target.value; $("#lista-areas").innerHTML = listaAreasNovo() }
});
document.addEventListener("change", e => {
  if (e.target.id === "sou") { S.eu = e.target.value || null; lsSet("sou", S.eu || ""); abrir() }
  if (e.target.id === "f-area") { S.f.area = e.target.value; abrir() } if (e.target.id === "f-pessoa") { S.f.pessoa = e.target.value; abrir() }
  if (e.target.id === "k-col") { S.kCol = e.target.value; abrir() }
  if (e.target.id === "p-entrega") S.novo.entrega = e.target.value;
});
window.addEventListener("hashchange", abrir);

async function iniciar() {
  const t = lsGet("tema"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; else document.documentElement.dataset.theme = "light";
  $("#abrir-menu").innerHTML = icone("menu"); $("#ic-busca").innerHTML = icone("onde");
  try { S.M = await Fonte.carregar() } catch (e) { $("#pag").innerHTML = `<div class="vazio">Não consegui carregar os dados da Central. Recarregue a página em alguns segundos.</div>`; return }
  S.eu = lsGet("sou") || (Fonte.previa ? "daniela" : null);
  abrir();
  await Fonte.conectar();
  const eu = await Fonte.quemSou(); S.meuId = eu.id; if (eu.chave) { S.eu = eu.chave; S.identificado = true }
  if (Fonte.db) {
    const erro = () => toast("Não consegui carregar os registros agora");
    const refaz = () => { if (!$("#camada .gaveta textarea:focus, #camada .gaveta input:focus, #camada .paleta")) abrir(); else moldura(rota().r) };
    Fonte.ouvir("pedidos", "criado_em", 300, xs => { S.M.pedidos = xs; refaz() }, erro);
    Fonte.ouvir("acoes_demandas", null, 500, xs => { S.acoes = Object.fromEntries(xs.map(d => [d.id, d])); refaz() }, erro);
    Fonte.ouvir("recuperador", null, 500, xs => { S.recup = Object.fromEntries(xs.map(d => [d.id, d])); refaz() }, erro);
    Fonte.ouvir("conselho", null, 200, xs => { S.conselho = Object.fromEntries(xs.map(d => [d.id, d])); refaz() }, erro);
    Fonte.ouvir("apontamentos", "data", 300, xs => { S.apont = xs; refaz() }, erro);
    Fonte.ouvir("chamados", "proposto_em", 300, xs => { S.M.chamados = xs; refaz() }, erro);
  }
  abrir();
}
iniciar();
</script>
</body></html>
