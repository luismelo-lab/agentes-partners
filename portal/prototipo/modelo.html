<title>Central Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cockpit por pessoa (números → Fazer agora → detalhe) + caixa de entrada única; Design System Save v0.5, modo painel (escuro). */
:root {
  --fundo: #000000; --fundo-2: #111111; --cartao: #171717; --elevado: #1E1E1E;
  --borda: #2A2A2A; --borda-3: #3A3A3A;
  --texto: #F5F5F5; --texto-2: #A1A1A1; --texto-3: #6B6B6B;
  --ouro: #F3CD60; --ouro-suave: rgba(243,205,96,.12);
  --sucesso: #44C653; --alerta: #E8B34A; --erro: #D64545; --info: #6E92E8;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 8px; --r-md: 12px; --ease: cubic-bezier(0.4, 0, 0.2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--fundo); color: var(--texto); }
body { margin: 0; font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rotulo { font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--texto-2); }
.rotulo.ouro { color: var(--ouro); }
a { color: var(--ouro); }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

/* topo */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(0,0,0,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borda); }
.faixa { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }
.linha-topo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 14px 10px; }
.linha-topo img { height: 26px; width: auto; }
.linha-topo h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.linha-topo .sep { width: 1px; height: 22px; background: var(--borda-3); }
.quem { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--fundo-2); border: 1px solid var(--borda); border-radius: var(--r-sm); padding: 3px; }
.seg button { font: 500 13px var(--sans); color: var(--texto-2); background: none; border: 0; border-radius: 6px; padding: 8px 12px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--elevado); color: var(--texto); box-shadow: inset 0 0 0 1px var(--borda-3); }
.atual { font: 12px var(--mono); color: var(--texto-3); }
.prot { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ouro); background: var(--ouro-suave); padding: 3px 8px; border-radius: 4px; }
nav[role="tablist"] { display: flex; gap: 2px; overflow-x: auto; }
nav[role="tablist"] button { background: none; border: 0; color: var(--texto-2); font: 500 14px var(--sans); padding: 12px 14px; min-height: 44px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav[role="tablist"] button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--ouro); }
.badge { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--ouro); color: #0F1115; font: 600 11px/18px var(--mono); text-align: center; }

main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
main > * { min-width: 0; }
section > h2 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--texto-2); margin: 0 0 14px; font-size: 14px; max-width: 70ch; }
.cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.cab h2 { margin: 0; font-size: 18px; font-weight: 600; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; }
.kpi { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 16px 18px; min-width: 0; display: grid; gap: 6px; }
.kpi .v { font: 500 30px/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi.destaque { border-color: rgba(243,205,96,.45); background: linear-gradient(180deg, rgba(243,205,96,.07), transparent 70%), var(--cartao); }
.kpi.destaque .v { color: var(--ouro); }
.kpi .d { color: var(--texto-2); font-size: 13px; }
.kpi[data-kpi] { cursor: pointer; transition: border-color 120ms var(--ease); } .kpi[data-kpi]:hover { border-color: var(--borda-3); }
.kpi .ver { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ouro); }
.delta { font: 500 12px var(--mono); }
.delta.sobe { color: var(--sucesso); } .delta.desce { color: var(--erro); }

/* listas de ação */
.lista { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 12px 14px 12px 0; min-width: 0; }
.item .tarja { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--borda-3); }
.item.urg .tarja { background: var(--erro); } .item.med .tarja { background: var(--alerta); }
.item .corpo { min-width: 0; display: grid; gap: 3px; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--texto-2); font-size: 13px; }
.item .meta .num { color: var(--texto); }
.item.feito { opacity: .45; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1.6 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; background: var(--fundo-2); color: var(--texto-2); border: 1px solid var(--borda); }
.chip.erro { color: var(--erro); border-color: rgba(214,69,69,.4); background: rgba(214,69,69,.08); }
.chip.alerta { color: var(--alerta); border-color: rgba(232,179,74,.4); background: rgba(232,179,74,.08); }
.chip.ok { color: var(--sucesso); border-color: rgba(68,198,83,.4); background: rgba(68,198,83,.08); }
.chip.ouro { color: var(--ouro); border-color: rgba(243,205,96,.4); background: var(--ouro-suave); }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid transparent; font: 600 14px var(--sans); cursor: pointer; background: var(--ouro); color: #0F1115; transition: filter 120ms var(--ease); }
.botao:hover { filter: brightness(.95); }
.botao.sec { background: transparent; color: var(--texto); border-color: var(--borda-3); }
.botao.peq { min-height: 36px; padding: 0 12px; font-size: 13px; }
.mais { margin-top: 10px; }

/* grade de blocos */
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px; }
.bloco { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.bloco h3 { margin: 0; font-size: 15px; font-weight: 600; }
.bloco .nota { color: var(--texto-3); font-size: 12px; margin: 0; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.mini div { display: grid; gap: 2px; min-width: 0; } .mini b { font: 500 17px var(--mono); white-space: nowrap; }

/* tabelas */
.tab-wrap { overflow-x: auto; border: 1px solid var(--borda); border-radius: var(--r-md); background: var(--cartao); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-2); padding: 12px; border-bottom: 1px solid var(--borda-3); white-space: nowrap; }
th button { all: unset; cursor: pointer; } th button:focus-visible { outline: 2px solid var(--ouro); }
td { padding: 11px 12px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.clic { cursor: pointer; } tbody tr.clic:hover td { background: var(--elevado); }
.saude { display: inline-flex; align-items: center; gap: 8px; }
.barrinha { width: 64px; height: 6px; background: var(--fundo-2); border-radius: 3px; overflow: hidden; }
.barrinha i { display: block; height: 100%; }

/* gráficos */
svg.graf { width: 100%; height: auto; display: block; }
svg.graf text { fill: var(--texto-2); font: 11px var(--mono); }
svg.graf .rot { fill: var(--texto); font: 12px var(--sans); }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; color: var(--texto-2); font-size: 12px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.prog { height: 10px; background: var(--fundo-2); border-radius: 5px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--ouro); }

/* filtros */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filtros button { font: 500 13px var(--sans); color: var(--texto-2); background: var(--fundo-2); border: 1px solid var(--borda); border-radius: 999px; padding: 0 14px; min-height: 36px; cursor: pointer; }
.filtros button[aria-pressed="true"] { color: #0F1115; background: var(--ouro); border-color: var(--ouro); }
input[type="search"], select, textarea, input[type="text"] { font: 14px var(--sans); color: var(--texto); background: var(--fundo-2); border: 1px solid var(--borda-3); border-radius: var(--r-sm); padding: 0 12px; min-height: 40px; min-width: 0; }
textarea { padding: 10px 12px; min-height: 90px; width: 100%; resize: vertical; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--texto-2); }

/* gaveta */
.veu { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--fundo-2); border-left: 1px solid var(--borda-3); z-index: 21; padding: calc(env(safe-area-inset-top, 0px) + 20px) 22px 24px; overflow-y: auto; display: grid; gap: 16px; align-content: start; }
.gaveta h3 { margin: 0; font-size: 18px; }
.par { display: grid; grid-template-columns: 140px 1fr; gap: 8px; font-size: 14px; } .par span:first-child { color: var(--texto-2); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--elevado); border: 1px solid var(--borda-3); color: var(--texto); padding: 12px 16px; border-radius: var(--r-sm); z-index: 30; font-size: 14px; max-width: calc(100% - 32px); }
.pacote { display: grid; gap: 10px; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 14px; }
.pacote h4 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pacote pre { margin: 0; white-space: pre-wrap; font: 13px/1.5 var(--mono); color: var(--texto); background: var(--fundo); border: 1px solid var(--borda); border-radius: var(--r-sm); padding: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--texto); }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ouro); flex-shrink: 0; }
.docs { display: flex; flex-wrap: wrap; gap: 8px; } .docs a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid var(--borda-3); border-radius: var(--r-sm); text-decoration: none; font-size: 13px; }
.saudeop { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font: 12px var(--mono); color: var(--texto-2); padding-block: 8px; border-top: 1px solid var(--borda); }
.saudeop .pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.saudeop button { all: unset; cursor: pointer; color: var(--ouro); } .saudeop button:focus-visible { outline: 2px solid var(--ouro); }
.parc { display: grid; gap: 10px; cursor: pointer; } .parc:hover { border-color: var(--borda-3); }
.spark { width: 100%; height: 34px; display: block; }
.busca-box { display: flex; gap: 8px; flex-wrap: wrap; } .busca-box input { flex: 1 1 260px; min-height: 44px; font-size: 15px; }
.resp { display: grid; gap: 8px; }
.vazio { border: 1px dashed var(--borda-3); border-radius: var(--r-md); padding: 18px; color: var(--texto-2); }
@media (max-width: 640px) {
  .item { grid-template-columns: 4px 1fr; } .item .acoes { grid-column: 2; justify-content: flex-start; }
  .linha-topo .sep { display: none; } .quem { margin-left: 0; width: 100%; }
  .kpi .v { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topo"><div class="faixa">
  <div class="linha-topo">
    <img src="__LOGO__" alt="Save Co.">
    <span class="sep" aria-hidden="true"></span>
    <h1>Central Partners</h1>
    <span class="prot">Protótipo</span>
    <div class="quem">
      <span class="rotulo">Ver como</span>
      <div class="seg" role="group" aria-label="Ver o painel como" id="pessoas"></div>
      <span class="atual" id="atual"></span>
    </div>
  </div>
  <nav role="tablist" aria-label="Seções" id="abas"></nav>
  <div class="saudeop" id="saudeop"></div>
</div></header>
<main id="conteudo"></main>
<div id="camada"></div>

<script type="application/json" id="dados">__DADOS__</script>
<script>
const D = JSON.parse(document.getElementById("dados").textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rs = v => { v = +v || 0; const a = Math.abs(v); return a >= 1e9 ? "R$ " + (v/1e9).toFixed(1).replace(".", ",") + " bi" : a >= 1e6 ? "R$ " + (v/1e6).toFixed(1).replace(".", ",") + " mi" : a >= 1e3 ? "R$ " + Math.round(v/1e3).toLocaleString("pt-BR") + " mil" : "R$ " + Math.round(v).toLocaleString("pt-BR") };
const n = v => (v ?? 0).toLocaleString("pt-BR");
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mesRot = m => MES[+m.slice(5,7) - 1] + "/" + m.slice(2,4);
const PESSOAS = {luis: "Luis", daniela: "Daniela", jenifer: "Jenifer", geovana: "Geovana"};
const ABAS = [["inicio", "Início"], ["caixa", "Caixa de entrada"], ["prazos", "Prazos e documentos"], ["parceiros", "Parceiros"], ["recorrencia", "Recorrência"], ["busca", "Busca"], ["biblioteca", "Biblioteca"], ["pedidos", "Pedidos"]];
const S = {eu: "luis", aba: "inicio", feitos: new Set(), filtro: {grupo: "todos", so_urg: false, busca: ""}, ordem: {campo: "saude", asc: true}};
try { S.eu = localStorage.getItem("cp-eu") || "luis"; S.aba = localStorage.getItem("cp-aba") || "inicio"; } catch (e) {}
if (!PESSOAS[S.eu]) S.eu = "luis"; if (!ABAS.some(a => a[0] === S.aba)) S.aba = "inicio";

const minhas = () => D.caixa.filter(x => (S.eu === "luis" ? true : x.pessoa === S.eu) && !S.feitos.has(x.id));
const doLuis = () => D.caixa.filter(x => x.pessoa === "luis" && !S.feitos.has(x.id));
const pronto = x => !!((x.pacote || {}).glpi || (x.pacote || {}).mensagem || (x.pacote || {}).encaminhar);
const corSaude = s => s >= 75 ? "var(--sucesso)" : s >= 60 ? "var(--alerta)" : "var(--erro)";

/* ---------- gráficos (SVG desenhado em escala) ---------- */
function barras(dados, {alt = 200, cor = "var(--ouro)", fmt = n, linha = null, corLinha = "var(--texto)"} = {}) {
  const W = 380, H = alt, m = {l: 6, r: 6, t: 18, b: 24}; const w = W - m.l - m.r, h = H - m.t - m.b;
  const max = Math.max(...dados.map(d => d.v), 1); const bw = w / dados.length;
  let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i = 0; i <= 3; i++) { const y = m.t + h - h * i / 3; s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--borda)" stroke-width="1"/>`; }
  dados.forEach((d, i) => { const bh = h * d.v / max, x = m.l + i * bw + bw * .18, y = m.t + h - bh, ult = i === dados.length - 1;
    s += `<rect x="${x}" y="${y}" width="${bw * .64}" height="${Math.max(bh, 1)}" rx="3" fill="${ult ? cor : "var(--borda-3)"}"><title>${esc(d.r)}: ${esc(fmt(d.v))}</title></rect>`;
    if (dados.length <= 8 || (dados.length - 1 - i) % 2 === 0) s += `<text x="${x + bw * .32}" y="${H - 8}" text-anchor="middle">${esc(d.r)}</text>`;
    if (ult || d.v === max) { const ax = x + bw * .32, anc = ax > W - 50 ? "end" : ax < 50 ? "start" : "middle"; s += `<text x="${anc === "end" ? x + bw * .64 : anc === "start" ? x : ax}" y="${y - 5}" text-anchor="${anc}" style="fill:var(--texto)">${esc(fmt(d.v))}</text>`; } });
  if (linha) { const lm = Math.max(...linha, 1); const pts = linha.map((v, i) => `${m.l + i * bw + bw / 2},${m.t + h - h * v / lm}`);
    s += `<polyline points="${pts.join(" ")}" fill="none" stroke="${corLinha}" stroke-width="2"/>`;
    linha.forEach((v, i) => { s += `<circle cx="${m.l + i * bw + bw / 2}" cy="${m.t + h - h * v / lm}" r="3" fill="${corLinha}"/>`; }); }
  return s + "</svg>";
}
function hbarras(dados, {fmt = n, cor = "var(--ouro)", larg = 130} = {}) {
  const W = 380, lh = 30, H = dados.length * lh + 8, max = Math.max(...dados.map(d => d.v), 1), w = W - larg - 78;
  let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
  dados.forEach((d, i) => { const y = 4 + i * lh, bw = Math.max(w * d.v / max, 2);
    s += `<text class="rot" x="0" y="${y + 18}">${esc(d.r.length > 19 ? d.r.slice(0, 18) + "…" : d.r)}</text>`;
    s += `<rect x="${larg}" y="${y + 6}" width="${bw}" height="16" rx="3" fill="${i === 0 ? cor : "var(--borda-3)"}"><title>${esc(d.r)}: ${esc(fmt(d.v))}</title></rect>`;
    s += `<text x="${larg + bw + 8}" y="${y + 18}" style="fill:var(--texto)">${esc(fmt(d.v))}</text>`; });
  return s + "</svg>";
}
function linhaG(vals, rots, {alt = 160, fmt = v => v + "%", ref = null} = {}) {
  const W = 380, H = alt, m = {l: 6, r: 42, t: 18, b: 24}, w = W - m.l - m.r, h = H - m.t - m.b;
  const max = Math.max(...vals, ref || 0, 1), x = i => m.l + w * i / Math.max(vals.length - 1, 1), y = v => m.t + h - h * v / max;
  let s = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let i = 0; i <= 3; i++) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + h * i / 3}" y2="${m.t + h * i / 3}" stroke="var(--borda)"/>`;
  if (ref != null) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--texto-3)" stroke-dasharray="4 4"/><text x="${W - m.r + 4}" y="${y(ref) + 4}">${esc(fmt(ref))}</text>`;
  s += `<path d="M${vals.map((v, i) => `${x(i)},${y(v)}`).join(" L")} L${x(vals.length - 1)},${m.t + h} L${x(0)},${m.t + h} Z" fill="var(--ouro-suave)"/>`;
  s += `<polyline points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="var(--ouro)" stroke-width="2"/>`;
  vals.forEach((v, i) => { if ((vals.length - 1 - i) % 3 === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === vals.length - 1 ? "end" : "middle"}">${esc(rots[i])}</text>`; });
  s += `<circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="4" fill="var(--ouro)"/><text x="${x(vals.length - 1) + 6}" y="${y(vals[vals.length - 1]) - 6}" style="fill:var(--texto)">${esc(fmt(vals[vals.length - 1]))}</text>`;
  return s + "</svg>";
}

/* ---------- blocos comuns ---------- */

async function buscaCnpj(q) {
  const d = q.replace(/\D/g, ""); if (d.length < 8) { S.cnpjRes = null; return; }

  S.cnpjRes = xs.length ? `<div class="bloco"><span class="rotulo ouro">Raiz do CNPJ já existe no HubSpot</span><h3>${n(xs.length)} negócio(s) · ${ps.map(esc).join(", ")}</h3>

}

      <label for="rc-motivo">Motivo ou observação<input type="text" id="rc-motivo" placeholder="Ex.: período coberto até 12/2024; só 10 meses novos"></label>
      <div class="acoes" style="justify-content:flex-start"><button class="botao" data-recok="${esc(x.caso)}">Aprovar recorrência</button><button class="botao sec" data-recok="${esc(x.caso)}" data-tipo="outra">Outra tese não coberta</button><button class="botao sec" data-recok="${esc(x.caso)}" data-tipo="dado">Precisa de dado</button><button class="botao sec" data-recok="${esc(x.caso)}" data-tipo="nao">Não aprovar</button></div>`); return; }
  if (t.dataset.recok) { S.feitos.add("rec-" + t.dataset.recok); $("#camada").innerHTML = ""; S.manter = true; render();
    toast({outra: "Marcado como outra tese: vai para pré-análise (GT1).", dado: "Marcado como precisa de dado.", nao: "Recorrência não aprovada. O motivo ensina a fila."}[t.dataset.tipo] || "Recorrência aprovada: negócio de recorrência para o parceiro e pré-análise (GT1). Protótipo: nada foi gravado."); return; }
  if ("urg" in t.dataset) { S.filtro.so_urg = !S.filtro.so_urg; S.manter = true; render(); return; }
  if (t.dataset.ord) { const k = t.dataset.ord; S.ordem = {campo: k, asc: S.ordem.campo === k ? !S.ordem.asc : k === "parceiro"}; S.manter = true; render(); return; }
  if ("fechar" in t.dataset) { $("#camada").innerHTML = ""; return; }
  if ("novo" in t.dataset) { gaveta(`<h3>Novo pedido aos agentes</h3><label for="p-tipo">Tipo de pedido<select id="p-tipo"><option>DM1 · Briefing de conta Master</option><option>DM3 · Rascunho de resposta ao parceiro</option><option>JB1 · Lista de prospects por Master</option><option>GT1 · Pré-análise tributária de empresa</option><option>GE2 · Relatório do HubSpot</option></select></label>
      <label for="p-master">Master<select id="p-master"><option value="">—</option>${D.masters.map(m => `<option>${esc(m.parceiro)}</option>`).join("")}</select></label>
      <label for="p-precisa">O que você precisa<textarea id="p-precisa" placeholder="Descreva a entrega que resolve o seu problema"></textarea></label>
      <button class="botao" data-enviar>Enviar pedido</button>`); return; }
  if ("enviar" in t.dataset) { $("#camada").innerHTML = ""; toast("Pedido enviado. Protótipo: nada foi gravado."); return; }
  if (t.dataset.abrir) { const x = D.caixa.find(i => i.id === t.dataset.abrir); if (x) gaveta(`<span class="rotulo ouro">${esc(x.tipo)}</span><h3>${esc(x.titulo)}</h3>${par("Responsável", esc(PESSOAS[x.pessoa]))}${x.master ? par("Master", esc(x.master)) : ""}${x.valor ? par("Valor", `<span class="num">${rs(x.valor)}</span>`) : ""}${x.dias != null ? par("Esperando", `<span class="num">${n(x.dias)}</span> dia(s)`) : ""}${par("Origem", esc(x.grupo))}
      ${pacoteHTML(x)}<button class="botao" data-feito="${esc(x.id)}">${pronto(x) ? "Marcar como encaminhado" : esc(x.acao.split(" / ")[0])}</button>`); return; }
  if (t.dataset.decidir || t.dataset.caso) { const x = D.geovana.lote.find(i => i.caso === (t.dataset.decidir || t.dataset.caso)); if (x) gaveta(`<span class="rotulo ouro">Recuperador · ${esc(x.tipo)}</span><h3>${esc(x.caso)}</h3>${par("Master", esc(x.parceiro))}${par("Segmento", esc(x.segmento) + " · " + esc(x.uf))}${par("Esperado", `<span class="num">${rs(x.esperado)}</span>`)}${par("Parecidos", esc(x.taxa))}${par("Aderência", esc(x.aderencia))}${par("Documentos", esc(x.docs || "—"))}
      <label for="d-motivo">Motivo ou observação<input type="text" id="d-motivo"></label><div class="acoes" style="justify-content:flex-start"><button class="botao" data-feito="${esc(x.caso)}">Aprovar reanálise</button><button class="botao sec" data-feito="${esc(x.caso)}">Precisa de dado</button><button class="botao sec" data-feito="${esc(x.caso)}">Vetar</button></div>`); return; }
  if (t.dataset.master) { const m = D.masters.find(i => i.parceiro === t.dataset.master); if (m) gaveta(`<span class="rotulo ouro">Master</span><h3>${esc(m.parceiro)}</h3>${par("Saúde", `<span class="num">${m.saude}</span>`)}${par("Abertos", `${n(m.abertos)} · <span class="num">${rs(m.abertos_rs)}</span>`)}${par("Parados", n(m.abertos_parados))}${par("Ganhos 90 dias", `${n(m.ganhos_90d)} · <span class="num">${rs(m.fechado_90d_rs)}</span>`)}${par("Fechado 12 meses", `<span class="num">${rs(m.fechado_12m_rs)}</span>`)}${par("Conversão 12 meses", String(m.conversao_12m_pct ?? "—").replace(".", ",") + "%")}${par("Ciclo mediano", n(m.ciclo_mediano_dias) + " dias")}${par("Honorário líquido 12m", `<span class="num">${rs(m.honorario_liquido_12m_rs)}</span>`)}${par("Repasses", `OK ${n((m.repasse || {}).ok)} · revisar ${n((m.repasse || {}).revisar)} · bloqueados ${n((m.repasse || {}).bloqueado)}`)}${par("Itens na caixa", n(m.alertas + m.demandas))}
      ${(() => { const f = D.ficha[m.parceiro]; return f ? `<div class="pacote"><h4>Repasse ao parceiro ${pctChip(m.parceiro)}</h4>${par("Honorário 12 meses", `<span class="num">${rs(f.honorario_12m)}</span>`)}${par("Repasse 12 meses", `<span class="num">${rs(f.comissao_12m)}</span>`)}${par("Potencial em aberto", `<span class="num">${rs(f.comissao_potencial_aberto)}</span>`)}${f.divergencias ? par("Atenção", `${n(f.divergencias)} negócio(s) com % diferente do cadastro`) : ""}
        <p class="nota">Honorário contratado × % de repasse do cadastro. Onde o % de honorário da Save não está no negócio, usa o típico do parceiro (${n(f.base_estimada)} de ${n(f.base_real + f.base_estimada)}).</p></div>
      ${(() => { const rc = f.recorrencia || {}; return `<div class="pacote"><h4>Recorrência <span class="chip ouro">${n(rc.elegiveis)} elegíveis</span></h4>${par("Potencial em negócios", `<span class="num">${rs(rc.pot_credito)}</span>`)}${par("Recorrências já feitas", n(rc.feitas))}${par("Honorário potencial", `<span class="num">${rs(rc.pot_honorario)}</span>`)}${par("Aguardando 6 meses", n(rc.aguardar))}${par("Já no pipeline (fora da análise)", n(rc.em_diagnostico))}
        ${(f.recorrencia_top || []).map(x => `<div class="check"><span class="chip">${n(x.meses_novos)} meses</span><span><b>${esc(x.caso)}</b> · ${rs(x.potencial_credito)} em negócios · ${n(x.recorrencias_feitas)} já feita(s)${x.sinais.length ? ` · <span class="nota">${esc(x.sinais[0].split(":")[0])}</span>` : ""}</span></div>`).join("")}</div>`; })()}
      <div class="pacote"><h4>Ganhos por mês</h4>${barras(f.serie.map(([k, v]) => ({r: mesRot(k), v})), {fmt: rs, alt: 170})}</div>
      <div class="pacote"><h4>Abertos por etapa</h4>${hbarras(f.etapas.map(([r, v]) => ({r, v})))}</div>
      ${f.uf.length ? `<div class="pacote"><h4>Onde já ganha</h4><div>${f.uf.map(([u, q]) => `<span class="chip">${esc(u)} · ${q}</span>`).join(" ")}</div></div>` : ""}
      <div class="acoes" style="justify-content:flex-start"><button class="botao" data-reuniao>Preparar reunião (briefing DM1)</button></div>` : ""; })()}
      <p class="sub">Base da futura ficha 360 do parceiro (PRM).</p>`); return; }
});
document.addEventListener("change", e => { if (e.target.id === "f-parc") { S.filtro.parc = e.target.value; S.manter = true; render(); } if (e.target.id === "f-rparc") { S.filtro.rparc = e.target.value; S.manter = true; render(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#camada").innerHTML = "";
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.clic, .parc, .kpi[data-kpi]")) { e.preventDefault(); e.target.click(); }
  if (e.target.matches('[role="tab"]') && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const i = ABAS.findIndex(a => a[0] === S.aba), j = (i + (e.key === "ArrowRight" ? 1 : ABAS.length - 1)) % ABAS.length; S.aba = ABAS[j][0]; render(); document.getElementById("tab-" + S.aba).focus(); }
});
document.addEventListener("input", async e => {
  if (e.target.id === "q") { S.q = e.target.value; S.cnpjRes = null; if (/\d{8,}/.test(S.q.replace(/\D/g, "")) && /^[\d.\/\-\s]+$/.test(S.q)) await buscaCnpj(S.q); $("#res-busca").innerHTML = resBusca(); return; } if (e.target.id === "busca") { S.filtro.busca = e.target.value; const pos = e.target.selectionStart; S.manter = true; render(); const b = $("#busca"); b.focus(); b.setSelectionRange(pos, pos); } });
render();
</script>
