<meta charset="utf-8">
<title>Central Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral agrupada + cockpit por pessoa (herói → alerta → números → fazer agora → análise). Design System Save v0.5, modo painel. */
:root {
  --fundo: #000000; --fundo-2: #111111; --cartao: #171717; --elevado: #1E1E1E;
  --borda: #2A2A2A; --borda-3: #3A3A3A;
  --texto: #F5F5F5; --texto-2: #A1A1A1; --texto-3: #6B6B6B;
  --ouro: #F3CD60; --ouro-suave: rgba(243,205,96,.12); --ouro-50: rgba(243,205,96,.5);
  --serie-2: #6B6B6B; --serie-3: #A1A1A1; --serie-4: #555555;
  --sucesso: #44C653; --alerta: #E8B34A; --erro: #D64545;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-sm: 8px; --r-md: 12px; --ease: cubic-bezier(0.4, 0, 0.2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--fundo); color: var(--texto); }
body { margin: 0; font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rotulo { font: 500 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--texto-2); }
a { color: var(--ouro); }
:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
button { font-family: var(--sans); }

/* estrutura */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.app { background: linear-gradient(90deg, var(--fundo-2) 232px, var(--borda) 232px 233px, var(--fundo) 233px); }
.lateral { position: sticky; top: 0; height: 100vh; background: var(--fundo-2); border-right: 1px solid var(--borda); display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; overflow-y: auto; }
.lateral .logo { height: 24px; width: auto; margin: 2px 8px 6px; align-self: flex-start; }
.lateral .nome { font-weight: 600; font-size: 14px; margin: 0 8px 14px; color: var(--texto-2); }
.grupo-nav { display: grid; gap: 2px; margin-bottom: 12px; }
.grupo-nav .rotulo { padding: 0 10px 4px; color: var(--texto-3); }
.nav-item { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: var(--texto-2); cursor: pointer; font-size: 14px; position: relative; }
.nav-item:hover { background: var(--cartao); color: var(--texto); }
.nav-item[aria-current="page"] { background: var(--elevado); color: var(--texto); }
.nav-item[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--ouro); }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item .badge { margin-left: auto; }
.nav-item:focus-visible { outline: 2px solid var(--ouro); }
.quem { margin-top: auto; border-top: 1px solid var(--borda); padding-top: 12px; display: grid; gap: 6px; }
.pessoas { display: flex; gap: 6px; padding: 0 6px; }
.pessoa { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); color: var(--texto-2); background: var(--cartao); border: 1px solid var(--borda); }
.pessoa[aria-pressed="true"] { color: #0F1115; background: var(--ouro); border-color: var(--ouro); }
.pessoa:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--elevado); color: var(--texto); border: 1px solid var(--borda-3); font: 600 11px/18px var(--mono); text-align: center; }

.conteudo { min-width: 0; }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(0,0,0,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borda); }
.topo-in { max-width: 1280px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topo h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.topo .sub { color: var(--texto-2); font-size: 13px; }
.topo .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prot { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ouro); background: var(--ouro-suave); padding: 3px 8px; border-radius: 4px; }
.op { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--texto-2); padding: 6px 10px; border: 1px solid var(--borda); border-radius: 999px; }
.op .pt { width: 8px; height: 8px; border-radius: 50%; }
.op.falha { color: var(--erro); border-color: rgba(214,69,69,.45); }
.op:focus-visible { outline: 2px solid var(--ouro); }

main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 96px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
main > * { min-width: 0; }
main.entra { animation: entra 180ms var(--ease); }
@keyframes entra { from { opacity: 0; } to { opacity: 1; } }
section > h2, .cab h2 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.atual { font: 12px var(--mono); color: var(--texto-3); }
.sub { color: var(--texto-2); margin: 4px 0 12px; font-size: 14px; max-width: 72ch; }
.nota { color: var(--texto-3); font-size: 12px; margin: 0; }

/* herói e números */
.topo-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.heroi { grid-column: span 2; position: relative; overflow: hidden; background: var(--cartao); border: 1px solid rgba(243,205,96,.4); border-radius: var(--r-md); padding: 24px; display: grid; gap: 14px; align-content: start; }
.heroi::after { content: ""; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(243,205,96,.14), transparent 65%); pointer-events: none; }
.heroi .v { font: 600 56px/1 var(--sans); color: var(--ouro); letter-spacing: -.02em; }
.heroi .t { font-size: 15px; color: var(--texto); max-width: 40ch; }
.heroi .lado { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.comp { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: transparent; }
.comp i { display: block; height: 100%; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 12px var(--mono); color: var(--texto-2); }
.leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.kpi { position: relative; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.kpi[data-kpi] { cursor: pointer; transition: border-color 120ms var(--ease); } .kpi[data-kpi]:hover { border-color: var(--borda-3); }
.kpi .cabk { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.kpi .v { font: 500 30px/1.05 var(--mono); letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi .v small { font-size: .55em; color: var(--texto-3); margin-right: 3px; }
.kpi .d { color: var(--texto-2); font-size: 13px; }
.kpi .ver { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--texto-3); }
.kpi[data-kpi]:hover .ver { color: var(--ouro); }
.delta { font: 500 12px var(--mono); white-space: nowrap; } .delta .s { color: var(--sucesso); } .delta .e { color: var(--erro); }
.spk { width: 100%; height: 32px; display: block; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; }

/* faixa de alerta */
.faixa { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r-md); border: 1px solid rgba(214,69,69,.4); background: rgba(214,69,69,.06); }
.faixa svg { width: 18px; height: 18px; color: var(--erro); flex: none; }
.faixa .txt { flex: 1 1 260px; font-size: 14px; }
.faixa .botao { margin-left: auto; }

/* chips e botões */
.chip { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1.6 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 1px 8px; border-radius: 4px; background: var(--fundo-2); color: var(--texto-2); border: 1px solid var(--borda); white-space: nowrap; }
.chip svg { width: 11px; height: 11px; }
.chip.erro { color: var(--erro); border-color: rgba(214,69,69,.45); background: rgba(214,69,69,.08); }
.chip.alerta { color: var(--alerta); border-color: rgba(232,179,74,.5); border-style: dashed; background: transparent; }
.chip.ok { color: var(--sucesso); border-color: rgba(68,198,83,.4); background: rgba(68,198,83,.08); }
.chip.ouro { color: var(--ouro); border-color: rgba(243,205,96,.4); background: var(--ouro-suave); }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid transparent; font: 600 14px var(--sans); cursor: pointer; background: var(--ouro); color: #0F1115; transition: filter 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease); white-space: nowrap; }
.botao:hover { filter: brightness(.95); }
.botao.sec { background: transparent; color: var(--texto); border-color: var(--borda-3); }
.botao.sec:hover { border-color: var(--ouro); color: var(--ouro); filter: none; }
.botao.peq { min-height: 36px; padding: 0 12px; font-size: 13px; }
.botao.icone { width: 44px; padding: 0; }

/* itens de ação */
.lista { display: grid; gap: 6px; }
.item { display: grid; grid-template-columns: 4px minmax(0, 1fr) 110px 86px auto; gap: 14px; align-items: center; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 10px 14px 10px 0; transition: background 120ms var(--ease); }
.item:hover { background: var(--elevado); }
.item .tarja { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--borda-3); }
.item.atrasado .tarja { background: var(--erro); }
.item.atencao .tarja { background: repeating-linear-gradient(180deg, var(--alerta) 0 6px, transparent 6px 9px); }
.item .corpo { min-width: 0; display: grid; gap: 2px; }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--texto-2); font-size: 13px; align-items: center; }
.item .val { text-align: right; font: 500 14px var(--mono); }
.item .idade { text-align: right; font: 500 13px var(--mono); color: var(--texto-2); }
.idade.a { color: var(--alerta); } .idade.e { color: var(--erro); }
.item.feito { opacity: .4; }
.grupo-tit { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; font: 600 14px var(--sans); }
.grupo-tit .badge { background: var(--fundo-2); }
details.grp > summary { list-style: none; cursor: pointer; } details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary .grupo-tit::after { content: "▾"; color: var(--texto-3); margin-left: auto; } details.grp:not([open]) > summary .grupo-tit::after { content: "▸"; }

/* blocos, tabelas */
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 16px; }
.grade-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.bloco { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.bloco h3 { margin: 0; font-size: 15px; font-weight: 600; }
.bloco .tese { font-size: 13px; color: var(--texto-2); margin: -6px 0 0; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.mini div { display: grid; gap: 2px; min-width: 0; } .mini b { font: 500 17px var(--mono); white-space: nowrap; }
.tab-wrap { overflow-x: auto; border: 1px solid var(--borda); border-radius: var(--r-md); background: var(--cartao); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-2); padding: 11px 12px; border-bottom: 1px solid var(--borda-3); white-space: nowrap; }
th button { all: unset; cursor: pointer; } th button:focus-visible { outline: 2px solid var(--ouro); }
td { padding: 10px 12px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.clic { cursor: pointer; } tbody tr.clic:hover td { background: var(--elevado); }
tbody tr.clic .botao { border-color: var(--borda-3); background: transparent; color: var(--texto); }
tbody tr.clic:hover .botao, tbody tr.clic:focus-within .botao { background: var(--ouro); color: #0F1115; border-color: var(--ouro); }
.saude { display: inline-flex; align-items: center; gap: 8px; }
.barrinha { width: 72px; height: 6px; background: var(--borda-3); border-radius: 3px; overflow: hidden; }
.barrinha i { display: block; height: 100%; }
.linha-m { display: grid; grid-template-columns: minmax(110px, 1.2fr) 120px repeat(3, minmax(70px, .7fr)) 140px 24px; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--borda); cursor: pointer; }
.linha-m:hover { background: var(--elevado); } .linha-m:last-child { border-bottom: 0; }
.linha-m .k { font: 500 13px var(--mono); text-align: right; } .linha-m .k small { display: block; font: 11px var(--mono); color: var(--texto-3); }

/* gráficos */
svg.graf { width: 100%; max-width: 760px; }
.estreito svg.graf { max-width: 560px; }
svg.graf { height: auto; display: block; overflow: visible; }
svg.graf text { fill: var(--texto-2); font: 11px var(--mono); }
svg.graf .rot { fill: var(--texto); font: 12px var(--sans); }
svg.graf .forte { fill: var(--texto); }
svg.graf [data-tip] { cursor: pointer; }
svg.graf [data-tip]:hover, svg.graf [data-tip]:focus { filter: brightness(1.25); outline: none; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--elevado); border: 1px solid var(--borda-3); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 var(--mono); color: var(--texto); max-width: 260px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.tip b { font-family: var(--sans); }
details.tabela > summary { cursor: pointer; font: 500 12px var(--mono); color: var(--texto-3); } details.tabela[open] > summary { margin-bottom: 8px; }
.prog { height: 8px; background: var(--borda-3); border-radius: 4px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--ouro); }

/* linha do tempo de prazos */
.tl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.tl .col { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 14px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.tl .col.quente { border-color: rgba(214,69,69,.45); }
.tl .col h4 { margin: 0; display: flex; justify-content: space-between; font: 600 13px var(--sans); }
.tl .mk { all: unset; cursor: pointer; display: flex; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--texto); padding: 6px 8px; border-radius: 6px; background: var(--fundo-2); }
.tl .mk:hover { background: var(--elevado); } .tl .mk i { width: 10px; height: 10px; border-radius: 50%; background: var(--serie-2); flex: none; }
.tl .col.quente .mk i { background: var(--erro); }

/* filtros e campos */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filtros button { font: 500 13px var(--sans); color: var(--texto-2); background: var(--fundo-2); border: 1px solid var(--borda); border-radius: 999px; padding: 0 14px; min-height: 36px; cursor: pointer; }
.filtros button[aria-pressed="true"] { color: var(--texto); background: var(--elevado); border-color: var(--ouro); }
input[type="search"], select, textarea, input[type="text"] { font: 14px var(--sans); color: var(--texto); background: var(--fundo-2); border: 1px solid var(--borda-3); border-radius: var(--r-sm); padding: 0 12px; min-height: 40px; min-width: 0; }
textarea { padding: 10px 12px; min-height: 90px; width: 100%; resize: vertical; }
label { display: grid; gap: 6px; font-size: 13px; color: var(--texto-2); }
.busca-box { display: flex; gap: 8px; } .busca-box input { flex: 1 1 auto; min-height: 48px; font-size: 16px; }

/* painel lateral */
.veu { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; animation: entra 180ms var(--ease); }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100%); background: var(--fundo-2); border-left: 1px solid var(--borda-3); z-index: 21; overflow-y: auto; animation: desliza 240ms var(--ease); display: flex; flex-direction: column; }
@keyframes desliza { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.gaveta-cab { position: sticky; top: 0; z-index: 2; background: var(--fundo-2); border-bottom: 1px solid var(--borda); padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 12px 22px; display: flex; gap: 12px; align-items: flex-start; }
.gaveta-cab .tt { flex: 1; min-width: 0; } .gaveta-cab h3 { margin: 2px 0 0; font-size: 18px; }
.gaveta-corpo { padding: 18px 22px 28px; display: grid; gap: 16px; align-content: start; }
.par { display: grid; grid-template-columns: 150px 1fr; gap: 8px; font-size: 14px; } .par span:first-child { color: var(--texto-2); }
.pacote { display: grid; gap: 10px; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r-md); padding: 14px; }
.pacote h4 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--texto); }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ouro); flex-shrink: 0; }
.docs { display: flex; flex-wrap: wrap; gap: 8px; } .docs a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid var(--borda-3); border-radius: var(--r-sm); text-decoration: none; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); background: var(--elevado); border: 1px solid var(--borda-3); color: var(--texto); padding: 12px 16px; border-radius: var(--r-sm); z-index: 30; font-size: 14px; max-width: calc(100% - 32px); }
.vazio { display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--borda-3); border-radius: var(--r-md); padding: 16px; color: var(--texto-2); font-size: 14px; }

/* barra inferior (celular) */
.inferior { display: none; }
@media (max-width: 1099px) {
  .app { grid-template-columns: 64px minmax(0, 1fr); background: linear-gradient(90deg, var(--fundo-2) 64px, var(--borda) 64px 65px, var(--fundo) 65px); }
  .lateral { padding: 14px 8px; } .lateral .logo, .lateral .nome, .grupo-nav .rotulo, .nav-item span, .quem .rotulo { display: none; }
  .nav-item { justify-content: center; padding: 0; } .nav-item .badge { position: absolute; top: 2px; right: 2px; min-width: 16px; padding: 0 4px; font-size: 10px; line-height: 15px; }
  .pessoas { flex-direction: column; align-items: center; }
  .topo-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .app { display: block; background: var(--fundo); } .lateral { display: none; }
  .inferior { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(17,17,17,.97); border-top: 1px solid var(--borda); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .inferior button { all: unset; display: grid; justify-items: center; gap: 2px; min-height: 56px; align-content: center; font-size: 11px; color: var(--texto-2); position: relative; cursor: pointer; }
  .inferior button[aria-current="page"] { color: var(--ouro); } .inferior svg { width: 20px; height: 20px; }
  .inferior .badge { position: absolute; top: 4px; left: 54%; font-size: 10px; min-width: 16px; line-height: 15px; padding: 0 4px; }
  .topo-in, main { padding-inline: 16px; }
  .topo-cards { grid-template-columns: minmax(0, 1fr); }
  .heroi { grid-column: auto; } .heroi .v { font-size: 40px; }
  .kpis.carrossel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding-bottom: 4px; }
  .kpis.carrossel .kpi { min-width: 72%; scroll-snap-align: start; }
  .tl { grid-template-columns: minmax(0, 1fr); }

  gaveta(c.titulo, corpo, ed ? `<button class="botao" data-chok="${esc(c.id)}">Aprovar e abrir no GLPI</button><button class="botao sec" data-chsalvar>Salvar edição</button><button class="botao sec txt-erro" data-chnao="${esc(c.id)}">Não abrir</button>` : st === "aprovado_manual" ? `<button class="botao sec" data-glpi="${esc(c.id)}">Copiar o texto para o GLPI</button>` : "", `Chamado · ${String(c.grupo).split(" > ")[0]}`); }
function abrirTarefa() { const tipos = ["Atendimento ao parceiro", "Encaminhamento a área", "Cobrança de área", "Atualização de CRM", "Reunião", "Prospecção", "Análise técnica", "Relatório", "Outro"];
  const hoje = S.apont.filter(a => a.pessoa === S.eu), tot = hoje.reduce((a, x) => a + x.min, 0);
  gaveta("Registrar tarefa", `<p class="nota">${hoje.length ? `Hoje: ${n(hoje.length)} tarefa(s), ${fmtMin(tot)}.` : "Primeira tarefa do dia."} Serve para medir o tempo do time (Semana 0).</p>
    <label for="t-desc">O que você fez?<input type="text" id="t-desc" maxlength="160" placeholder="Ex.: encaminhei o contrato da Panificadora Araújo ao Tributário"></label>
    <div><span class="rotulo">Tipo</span><div class="filtros" style="margin:6px 0 0">${tipos.map((x, i) => `<button type="button" data-mtipo="${esc(x)}" aria-pressed="${i === 0}">${esc(x)}</button>`).join("")}</div></div>
    <label for="t-master">Master (opcional)<select id="t-master"><option value="">—</option>${D.masters.map(m => `<option>${esc(m.parceiro)}</option>`).join("")}</select></label>
    <div><span class="rotulo">Minutos</span><div class="filtros" style="margin:6px 0 0">${[5, 15, 30, 60].map(m => `<button type="button" data-mmin="${m}" aria-pressed="${m === 15}">${m}</button>`).join("")}<input type="text" id="t-min" inputmode="numeric" value="15" aria-label="Minutos" style="width:80px"></div></div>
    <label class="check" for="t-ponte"><input type="checkbox" id="t-ponte"><span>Foi só ponte: repassei, cobrei ou devolvi sem resolver</span></label>`, `<button class="botao" data-tsalvar>Registrar</button>`, "Semana 0 · " + PESSOAS[S.eu]); setTimeout(() => $("#t-desc")?.focus(), 50); }
function abrirPedir(cod) { const c = D.catalogo.find(i => i.codigo === cod) || {};
  gaveta(c.rotulo || cod, `<div class="confira"><b>O que volta:</b> ${esc(c.entrega)}<br><span class="nota">Informe: ${esc((c.precisa || []).join(", "))} · vai para ${esc(c.celula)}</span></div>
    <label for="p-master">Master ou parceiro<select id="p-master"><option value="">—</option><option>Todos</option>${D.masters.map(m => `<option>${esc(m.parceiro)}</option>`).join("")}</select></label>
    <label for="p-cliente">Cliente, CNPJ ou link do HubSpot<input type="text" id="p-cliente" maxlength="300"></label>
    <label for="p-precisa">O que você precisa<textarea id="p-precisa" maxlength="1500" placeholder="Descreva a entrega que resolve o seu problema"></textarea></label>
    <div class="mini" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><label for="p-uso">Para que vai usar<select id="p-uso">${["Reunião", "Resposta ao parceiro", "Decisão interna", "Prospecção", "Levantamento", "Outro"].map(x => `<option>${x}</option>`).join("")}</select></label>
      <label for="p-formato">Formato<select id="p-formato">${["Resumo na tela", "Planilha", "Word", "Rascunho de mensagem"].map(x => `<option>${x}</option>`).join("")}</select></label><label for="p-prazo">Prazo<input type="text" id="p-prazo" placeholder="dd/mm"></label></div>
    <label for="p-contexto">Informações que ajudam<textarea id="p-contexto" maxlength="1500" placeholder="Não escreva dados bancários, CPF ou senhas."></textarea></label>`, `<button class="botao" data-penviar>Enviar pedido</button>`, "Pedido aos agentes · " + cod); }
function abrirPedido(p) { const R = p.resposta, st = pedSt(p), pode = st === "aguardando_aprovacao";
  gaveta((p.campos || {}).precisa || p.codigo, `${par("Pedido", `${esc(p.pid || p.id)} · ${esc(p.codigo)}`)}${par("Situação", esc((ST_PED[st] || [st])[0]))}${(p.campos || {}).master ? par("Master", esc(p.campos.master)) : ""}${(p.campos || {}).uso ? par("Para", esc(p.campos.uso) + " · " + esc(p.campos.formato || "")) : ""}
    ${R ? `<div class="pacote"><h4>Resposta · versão ${esc(R.versao || 1)}</h4><p>${esc(R.resumo || "")}</p></div>
      ${(R.secoes || []).map((z, i) => `<details class="grp" ${i === 0 ? "open" : ""}><summary><div class="grupo-tit">${esc(z.titulo)}</div></summary><div class="resposta-md">${mdH(z.texto)}</div></details>`).join("")}
      ${conferidoHTML((R.conferido || []).map(c => typeof c === "string" ? {item: c, ok: true, resultado: ""} : {ok: true, ...c}))}
      ${(R.conferir || []).length ? `<div class="confira"><b>${(R.conferido || []).length ? "Só você pode conferir" : "Antes de usar, confira"}</b><ul>${R.conferir.map(z => `<li>${esc(z)}</li>`).join("")}</ul></div>` : ""}
      ${(R.arquivos || []).length ? `<div class="pacote"><h4>Arquivos no OneDrive</h4>${R.arquivos.map(z => `<p class="mono" style="font-size:12px">${esc(z)}</p>`).join("")}</div>` : ""}` : `<div class="vazio">${ico("info")}<span>Os agentes ainda não responderam.</span></div>`}
    ${pode ? `<label for="p-nota">Comentário (obrigatório em "Pedir nova análise" e "Não aprovado")<textarea id="p-nota" maxlength="1500"></textarea></label>` : ""}`,
    pode ? `<button class="botao" data-pdec="aprovado" data-id="${esc(p.id)}">Aprovado</button><button class="botao sec" data-pdec="nova_analise" data-id="${esc(p.id)}">Pedir nova análise</button><button class="botao sec txt-erro" data-pdec="nao_aprovado" data-id="${esc(p.id)}">Não aprovado</button>` : "", "Pedido aos agentes"); }
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#camada").innerHTML) fechar();
  if ((e.key === "t" || e.key === "T") && !$("#camada").innerHTML && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) abrirTarefa();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.clic, .linha-m, .kpi[data-kpi], circle[data-master]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => { if (e.target.id === "f-parc") { S.filtro.parc = e.target.value; S.manter = true; render(); } if (e.target.id === "f-rparc") { S.filtro.rparc = e.target.value; S.manter = true; render(); } });
document.addEventListener("input", async e => {
  if (e.target.id === "q") { S.q = e.target.value; S.cnpjRes = null; if (/\d{8,}/.test(S.q.replace(/\D/g, "")) && /^[\d.\/\-\s]+$/.test(S.q)) await buscaCnpj(S.q); $("#res-busca").innerHTML = resBusca(); return; }
  if (e.target.id === "busca") { S.filtro.busca = e.target.value; const pos = e.target.selectionStart; S.manter = true; render(); const b = $("#busca"); b.focus(); b.setSelectionRange(pos, pos); }
});
document.querySelectorAll(".tarefa-btn").forEach(b => b.innerHTML = b.innerHTML.replace("__ICO_TAREFA__", ico("tarefa")));
S.animar = true; render();
</script>
